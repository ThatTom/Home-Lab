# Komodo stack definitions
# Secrets are [[VARIABLE]] references, filled in by Komodo at deploy time from its Variables (marked secret)
# The values live in the Komodo database, which is backed up by the nightly pg_dumpall
# Create any new Variable in Komodo before syncing a stack that references it

[[stack]]
name = "gitea"
[stack.config]
swarm = "hogwarts"
linked_repo = "HogwartsNetwork-GitHub"
run_directory = "docker-compose/git"
file_paths = ["gitea.yaml"]

##

[[stack]]
name = "gitea-mirror"
[stack.config]
swarm = "hogwarts"
linked_repo = "HogwartsNetwork"
run_directory = "docker-compose/git"
file_paths = ["gitea-mirror.yaml"]
environment = """
BETTER_AUTH_SECRET=[[GITEA_MIRROR_BETTER_AUTH_SECRET]]
GITHUB_USERNAME=
GITHUB_TOKEN=
PRIVATE_REPOSITORIES=
MIRROR_STARRED=
MIRROR_ORGANIZATIONS=
GITEA_USERNAME=ThatT0m
GITEA_TOKEN=[[GITEA_MIRROR_GITEA_TOKEN]]
GITEA_ORG_VISIBILITY=default
SCHEDULE_ENABLED=true
GITEA_MIRROR_INTERVAL=8h
AUTO_IMPORT_REPOS=true
AUTO_MIRROR_REPOS=false
CLEANUP_DELETE_IF_NOT_IN_GITHUB=false
CLEANUP_ORPHANED_REPO_ACTION=archive
CLEANUP_DRY_RUN=true
"""


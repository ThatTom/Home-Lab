[stack.config]
swarm = "hogwarts"
linked_repo = "HogwartsNetwork"
run_directory = "docker-compose/media/management"
file_paths = ["spindle.yaml"]
environment = """
SONARR_URL=http://sonarr:8989
RADARR_URL=http://radarr:7878
SONARR_API_KEY=[[SONARR_API_KEY]]
RADARR_API_KEY=[[RADARR_API_KEY]]

# Leave blank to use the first root folder and quality profile configured in Sonarr/Radarr
SONARR_ROOT_FOLDER=
SONARR_QUALITY_PROFILE_ID=
RADARR_ROOT_FOLDER=
RADARR_QUALITY_PROFILE_ID=

SYNC_INTERVAL_SECONDS=60
LIBRARY_CACHE_TTL_MS=90000

# Blank uses the free UPCitemdb trial endpoint (~100 lookups/day)
UPCITEMDB_API_KEY=
TMDB_API_KEY=[[SPINDLE_TMDB_API_KEY]]

# Requests from private network addresses skip the login while AUTH_TRUST_LOCAL_NETWORK is true
AUTH_PASSWORD=[[SPINDLE_AUTH_PASSWORD]]
AUTH_TRUST_LOCAL_NETWORK="true"
"""


environment = """
HOST=0.0.0.0
PORT=3000
RACKPAD_PORT=3110
DATABASE_PATH=./rackpad.db
RACKPAD_SECRET_KEY=
SNMP_TRAP_ENABLED=1
SNMP_TRAP_PORT=1162
SNMP_TRAP_BIND=0.0.0.0
SNMP_INVENTORY_SYNC=1
MONITOR_INTERVAL_MS=300000
DISCOVERY_SCAN_MAX_ACTIVE=2
DISCOVERY_SCAN_MAX_ACTIVE_PER_LAB=1
DISCOVERY_SCAN_MAX_QUEUED=32
NODE_ENV=production
TRUST_PROXY=0
TRUSTED_HOSTS=
TRUSTED_ORIGINS=
APP_URL=
OIDC_ENABLED=0
OIDC_ISSUER_URL=https://auth.hogwartsnetwork.co.uk/oidc
OIDC_CLIENT_ID=Ox5PRHp3_mQ1MCje
OIDC_CLIENT_SECRET=[[RACKPAD_OIDC_CLIENT_SECRET]]
OIDC_REDIRECT_URI=https://rackpad.hogwartsnetwork.co.uk/api/auth/oidc/callback
OIDC_LABEL=OIDC
OIDC_DEFAULT_ROLE=viewer
OIDC_DEBUG=0
OIDC_ADMIN_USERS=
OIDC_EDITOR_USERS=
OIDC_VIEWER_USERS=
OIDC_ADMIN_GROUPS=
OIDC_EDITOR_GROUPS=
OIDC_VIEWER_GROUPS=
OUI_AUTO_UPDATE=1
DISCOVERY_MAC_SCAN_MODE=auto
"""


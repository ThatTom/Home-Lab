# Nightly 02:00 deploy of changed stacks from main
# Each stack is its own stage so deploys run one at a time; executions within a stage run in parallel
# and parallel deploys sharing the HogwartsNetwork repo were failing with "getwd: no such file or directory"
# A failed stage stops the procedure, so stacks after it are skipped until the next run
# New stacks need a stage adding here

[[procedure]]
name = "2AM - Auto Update"
config.schedule = "Run every day at 02:00 am"

[[procedure.config.stage]]
name = "Repo Update"
enabled = true
executions = [
  { execution.type = "CloneRepo", execution.params.repo = "HogwartsNetwork", enabled = true },
  { execution.type = "CloneRepo", execution.params.repo = "HogwartsNetwork-GitHub", enabled = true }
]

[[procedure.config.stage]]
name = "gitea-mirror"
enabled = true
executions = [
  { execution.type = "DeployStackIfChanged", execution.params.stack = "gitea-mirror", enabled = true }
]


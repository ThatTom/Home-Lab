# Komodo alerts posted to the homelab-alerts ntfy topic
# No resources whitelist on purpose: an empty list alerts on every server, swarm and stack, so new
# stacks are covered automatically. A whitelist here also hits a Resource Sync bug
# (https://github.com/moghtech/komodo/issues/1718): names are stored with an empty id, so the
# whitelist matches nothing, the sync never settles, and every apply adds the entries again.

[[alerter]]
name = "Hogwarts NTFY"
[alerter.config]
enabled = true
endpoint.type = "Ntfy"
endpoint.params.url = "https://ntfy.hogwartsnetwork.co.uk/homelab-alerts"
alert_types = [
  "ServerUnreachable",
  "SwarmUnhealthy",
  "ContainerStateChange",
  "StackStateChange"
]

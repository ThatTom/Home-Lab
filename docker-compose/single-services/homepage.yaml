services:
  homepage:
    image: ghcr.io/gethomepage/homepage:v2.6.0
    environment:
      HOMEPAGE_ALLOWED_HOSTS: ${HOMEPAGE_ALLOWED_HOSTS} # required, may need port. See gethomepage.dev/installation/#homepage_allowed_hosts
      HOMEPAGE_AUTH_ENABLED: ${HOMEPAGE_AUTH_ENABLED}
      HOMEPAGE_AUTH_SECRET: ${HOMEPAGE_AUTH_SECRET}
      HOMEPAGE_EXTERNAL_URL: ${HOMEPAGE_EXTERNAL_URL}
      HOMEPAGE_OIDC_ISSUER: ${HOMEPAGE_OIDC_ISSUER}
      HOMEPAGE_OIDC_CLIENT_ID: ${HOMEPAGE_OIDC_CLIENT_ID}
      HOMEPAGE_OIDC_CLIENT_SECRET: ${HOMEPAGE_OIDC_CLIENT_SECRET}
      HOMEPAGE_OIDC_NAME: ${HOMEPAGE_OIDC_NAME}
      # Used by the FreshRSS widget in services.yaml
      HOMEPAGE_VAR_FRESHRSS_USERNAME: ${FRESHRSS_USERNAME}
      HOMEPAGE_VAR_FRESHRSS_API_PASSWORD: ${FRESHRSS_API_PASSWORD}
    # Config comes from the repo (configs/homepage), so it can run on any node
    configs:
      - source: homepage-settings
        target: /app/config/settings.yaml
      - source: homepage-services
        target: /app/config/services.yaml
      - source: homepage-widgets
        target: /app/config/widgets.yaml
      - source: homepage-bookmarks
        target: /app/config/bookmarks.yaml
    networks:
      - diagon-alley
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      labels:
        # Traefik
        - "traefik.enable=true"
        - "traefik.swarm.network=diagon-alley"
        # Router
        - "traefik.http.routers.dashboard.rule=Host(`dashboard.hogwartsnetwork.co.uk`)"
        - "traefik.http.routers.dashboard.entrypoints=websecure"
        - "traefik.http.routers.dashboard.tls=true"
        - "traefik.http.routers.dashboard.tls.certresolver=cloudflare"
        - "traefik.http.routers.dashboard.service=dashboard"
        # Service
        - "traefik.http.services.dashboard.loadbalancer.server.port=3000"

networks:
  diagon-alley:
    external: true

# Configs can't change in place, bump a suffix when its file changes
configs:
  homepage-settings:
    name: homepage-settings-v1
    file: ./configs/homepage/settings.yaml

  homepage-services:
    name: homepage-services-v4
    file: ./configs/homepage/services.yaml

  homepage-widgets:
    name: homepage-widgets-v1
    file: ./configs/homepage/widgets.yaml

  homepage-bookmarks:
    name: homepage-bookmarks-v2
    file: ./configs/homepage/bookmarks.yaml

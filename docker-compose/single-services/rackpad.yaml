services:
  rackpad:
    image: ghcr.io/kobii-git/rackpad:1.8.3
    env_file: .env
    user: "10001:985"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_PATH: /data/rackpad.db
      # Reverse proxy configuration
      TRUST_PROXY: "1"
      TRUSTED_HOSTS: rackpad.hogwartsnetwork.co.uk
      TRUSTED_ORIGINS: https://rackpad.hogwartsnetwork.co.uk
      # Monitoring
      MONITOR_INTERVAL_MS: 300000
      # OIDC (VoidAuth) - issuer, client ID/secret and redirect URI come from .env
      OIDC_ENABLED: "1"
      OIDC_LABEL: Hogwarts SSO
      OIDC_DEFAULT_ROLE: rackpad_viewer
      OIDC_ADMIN_GROUPS: rackpad_admin
    volumes:
      - rackpad_data:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - diagon-alley
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == dumbledore
      restart_policy:
        condition: on-failure
      labels:
        # Traefik
        - "traefik.enable=true"
        - "traefik.swarm.network=diagon-alley"
        # Router
        - "traefik.http.routers.rackpad.rule=Host(`rackpad.hogwartsnetwork.co.uk`)"
        - "traefik.http.routers.rackpad.entrypoints=websecure"
        - "traefik.http.routers.rackpad.tls=true"
        - "traefik.http.routers.rackpad.tls.certresolver=cloudflare"
        # Service
        - "traefik.http.services.rackpad.loadbalancer.server.port=3000"

volumes:
  rackpad_data:
    name: rackpad_data

networks:
  diagon-alley:
    external: true

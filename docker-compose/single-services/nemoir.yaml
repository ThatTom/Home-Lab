services:
  nemoir:
    # Built and pushed by .gitea/workflows/docker-build.yml. Pin to a version
    # (e.g. :1.2.0) or commit (e.g. :sha-abc1234) rather than :latest.
    image: git.hogwartsnetwork.co.uk/hogwartsimages/nemoir:sha-5944619
    env_file: .env
    volumes:
      # SQLite database + cached cover images live here - back this up.
      # To use a host folder instead (e.g. ./data:/data), make it writable by
      # the container user first: sudo chown -R 1000:1000 ./data
      - nemoir-data:/data
    networks:
      - diagon-alley
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == flitwick
      restart_policy:
        condition: on-failure
      labels:
        # Traefik
        - "traefik.enable=true"
        - "traefik.swarm.network=diagon-alley"
        # Router
        - "traefik.http.routers.nemoir.rule=Host(`books.hogwartsnetwork.co.uk`)"
        - "traefik.http.routers.nemoir.entrypoints=websecure"
        - "traefik.http.routers.nemoir.tls=true"
        - "traefik.http.routers.nemoir.tls.certresolver=cloudflare"
        # Service
        - "traefik.http.services.nemoir.loadbalancer.server.port=3000"

volumes:
  nemoir-data:
    # Fixed name so the data doesn't depend on the folder the repo is cloned into.
    name: nemoir-data

networks:
  diagon-alley:
    external: true

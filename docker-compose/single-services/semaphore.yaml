services:
  semaphore:
    image: semaphoreui/semaphore:v2.19.16
    environment:
      SEMAPHORE_DB_DIALECT: sqlite
      SEMAPHORE_ADMIN: ${SEMAPHORE_ADMIN}
      SEMAPHORE_ADMIN_PASSWORD: ${SEMAPHORE_ADMIN_PASSWORD}
      SEMAPHORE_ADMIN_NAME: ${SEMAPHORE_ADMIN_NAME}
      SEMAPHORE_ADMIN_EMAIL: ${SEMAPHORE_ADMIN_EMAIL}
      SEMAPHORE_WEB_ROOT: https://semaphore.hogwartsnetwork.co.uk
      SEMAPHORE_OIDC_PROVIDERS: |
        {
          "voidauth": {
            "display_name": "Hogwarts SSO",
            "provider_url": "${SEMAPHORE_OIDC_ISSUER}",
            "client_id": "${SEMAPHORE_OIDC_CLIENT_ID}",
            "client_secret": "${SEMAPHORE_OIDC_CLIENT_SECRET}",
            "redirect_url": "https://semaphore.hogwartsnetwork.co.uk/api/auth/oidc/voidauth/redirect",
            "scopes": ["openid", "profile", "email"],
            "username_claim": "preferred_username",
            "email_claim": "email",
            "name_claim": "name"
          }
        }
    volumes:
      # Database and config on the NAS so Semaphore can run on any node, repo clones stay local
      - semaphore-data:/var/lib/semaphore:nocopy
      - semaphore-config:/etc/semaphore:nocopy
      - semaphore_tmp:/tmp/semaphore
    networks:
      - diagon-alley
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:3000/api/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      # Never more than one copy, SQLite can only be opened by one Semaphore at a time
      replicas: 1
      restart_policy:
        condition: on-failure
      labels:
        # Traefik
        - "traefik.enable=true"
        - "traefik.swarm.network=diagon-alley"
        # Router
        - "traefik.http.routers.semaphore.rule=Host(`semaphore.hogwartsnetwork.co.uk`)"
        - "traefik.http.routers.semaphore.entrypoints=websecure"
        - "traefik.http.routers.semaphore.tls=true"
        - "traefik.http.routers.semaphore.tls.certresolver=cloudflare"
        # Service
        - "traefik.http.services.semaphore-api.loadbalancer.server.port=3000"

volumes:
  semaphore-data:
    name: semaphore-data
    external: true    # NFS share, created on every node by ansible/swarm.yml

  semaphore-config:
    name: semaphore-config
    external: true    # NFS share, created on every node by ansible/swarm.yml

  semaphore_tmp:

networks:
  diagon-alley:
    external: true

services:
  immich-server:
    image: ghcr.io/immich-app/immich-server:v3.2.0
    volumes:
      - libary:/data
      - /etc/localtime:/etc/localtime:ro
    environment:
      TZ: Europe/London
    #ports:
    #  - 2283:2283
    depends_on:
      - redis
      - database
    networks:
        - diagon-alley
        - immich-internal
    healthcheck:
      disable: false
    deploy:
        replicas: 1
        placement:
            constraints:
                - node.hostname == srv-01
        restart_policy:
            condition: on-failure
        labels:
            - "diun.enable=true"

            - "traefik.enable=true"
            - "traefik.swarm.network=diagon-alley"
            
            # Authelia web interface
            - "traefik.http.routers.immich.rule=Host(`immich.hogwartsnetwork.co.uk`)"
            - "traefik.http.routers.immich.entrypoints=websecure"
            - "traefik.http.routers.immich.tls=true"
            - "traefik.http.routers.immich.tls.certresolver=cloudflare"
            
            # Authelia listens on 9091
            - "traefik.http.services.immich.loadbalancer.server.port=2283"

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:v3.2.0
    volumes:
      - model-cache:/cache
    networks:
        - immich-internal
    healthcheck:
      disable: false
    deploy:
        replicas: 1
        placement:
            constraints:
                - node.hostname == srv-01
        restart_policy:
            condition: on-failure

  redis:
    image: docker.io/valkey/valkey:9@sha256:4963247afc4cd33c7d3b2d2816b9f7f8eeebab148d29056c2ca4d7cbc966f2d9
    healthcheck:
      test: redis-cli ping || exit 1
    networks:
        - immich-internal
    deploy:
        replicas: 1
        placement:
            constraints:
                - node.hostname == srv-01
        restart_policy:
            condition: on-failure

  database:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: --data-checksums
      DB_STORAGE_TYPE: SSD
    volumes:
      - postgres-data:/var/lib/postgresql/data
    shm_size: 128mb
    networks:
        - immich-internal
    healthcheck:
      disable: false
    deploy:
        replicas: 1
        placement:
            constraints:
                - node.hostname == srv-01
        restart_policy:
            condition: on-failure

volumes:
  model-cache:
  postgres-data:
  libary:

networks:
    diagon-alley:
        external: true

    immich-internal:
        external: false
services:
  immich-server:
    image: ghcr.io/immich-app/immich-server:v3.3.3
    depends_on:
      - redis
      - database
    environment:
      TZ: Europe/London
    #ports:
    #  - "2283:2283"
    volumes:
      - libary:/data
      - /etc/localtime:/etc/localtime:ro
    networks:
      - diagon-alley
      - immich-internal
    healthcheck:
      disable: false
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == dobby
      restart_policy:
        condition: on-failure
      labels:
        # Traefik
        - "traefik.enable=true"
        - "traefik.swarm.network=diagon-alley"
        # Router
        - "traefik.http.routers.immich.rule=Host(`immich.hogwartsnetwork.co.uk`)"
        - "traefik.http.routers.immich.entrypoints=websecure"
        - "traefik.http.routers.immich.tls=true"
        - "traefik.http.routers.immich.tls.certresolver=cloudflare"
        # Service
        - "traefik.http.services.immich.loadbalancer.server.port=2283"

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:v3.3.3
    volumes:
      - model-cache:/cache
    networks:
      - immich-internal
    healthcheck:
      disable: false
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == dobby
      restart_policy:
        condition: on-failure

  redis:
    image: docker.io/valkey/valkey:9@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd
    networks:
      - immich-internal
    healthcheck:
      test: redis-cli ping || exit 1
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == dobby
      restart_policy:
        condition: on-failure

  database:
    # Stay on the Postgres major version the data was created with, upgrading needs a dump and restore
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    shm_size: 128mb
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: --data-checksums
      DB_STORAGE_TYPE: SSD
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - immich-internal
    healthcheck:
      disable: false
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == dobby
      restart_policy:
        condition: on-failure

volumes:
  model-cache:
  postgres-data:
  libary:

networks:
  diagon-alley:
    external: true

  immich-internal:

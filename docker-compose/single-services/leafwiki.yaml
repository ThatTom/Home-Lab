services:
  leafwiki:
    image: ghcr.io/perber/leafwiki:v0.14.1
    environment:
      LEAFWIKI_JWT_SECRET: ${LEAFWIKI_JWT_SECRET}
      LEAFWIKI_ADMIN_PASSWORD: ${LEAFWIKI_ADMIN_PASSWORD}
      LEAFWIKI_ALLOW_INSECURE: ${LEAFWIKI_ALLOW_INSECURE}
    volumes:
      - leafwiki:/data
    networks:
      - diagon-alley
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == dumbledore
      restart_policy:
        condition: on-failure
      labels:
        # Traefik
        - "traefik.enable=true"
        - "traefik.swarm.network=diagon-alley"
        # Router
        - "traefik.http.routers.leafwiki.rule=Host(`wiki.hogwartsnetwork.co.uk`)"
        - "traefik.http.routers.leafwiki.entrypoints=websecure"
        - "traefik.http.routers.leafwiki.tls=true"
        - "traefik.http.routers.leafwiki.tls.certresolver=cloudflare"
        # Service
        - "traefik.http.services.leafwiki.loadbalancer.server.port=8080"

volumes:
  leafwiki:
    name: leafwiki

networks:
  diagon-alley:
    external: true

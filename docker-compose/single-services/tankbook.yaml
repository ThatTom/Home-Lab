services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tankbook
      POSTGRES_USER: ${DB_USER:-tankbook}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tankbook-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-tankbook}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == dumbledore
      restart_policy:
        condition: on-failure

  app:
    image: ghcr.io/tankbook/tankbook-app:1.0.1
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://${DB_USER:-tankbook}:${DB_PASSWORD:-changeme}@db/tankbook
      SPECIES_DATA_PATH: /app/species-data
      IMAGES_PATH: /app/images
    ports:
      - "3030:3000"
    volumes:
      - species_data:/app/species-data
      - tankbook-images:/app/images
    networks:
      - diagon-alley
      - tankbook-internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == dumbledore
      restart_policy:
        condition: on-failure
      labels:
        # Traefik
        - "traefik.enable=true"
        - "traefik.swarm.network=diagon-alley"
        # Router
        - "traefik.http.routers.tankbook.rule=Host(`tankbook.hogwartsnetwork.co.uk`)"
        - "traefik.http.routers.tankbook.entrypoints=websecure"
        - "traefik.http.routers.tankbook.tls=true"
        - "traefik.http.routers.tankbook.tls.certresolver=cloudflare"
        # Service
        - "traefik.http.services.tankbook.loadbalancer.server.port=3000"

volumes:
  postgres_data:
  species_data:
  tankbook-images:

networks:
  diagon-alley:
    external: true

  tankbook-internal:

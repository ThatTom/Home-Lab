services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    networks:
      - tankbook-internal
    environment:
      POSTGRES_DB: tankbook
      POSTGRES_USER: ${DB_USER:-tankbook}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-tankbook}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == rpi-1
      restart_policy:
        condition: on-failure

  app:
    image: ghcr.io/tankbook/tankbook-app:latest
    restart: unless-stopped
    depends_on:
      - db
    networks:
      - diagon-alley
      - tankbook-internal
    environment:
      DATABASE_URL: postgresql://${DB_USER:-tankbook}:${DB_PASSWORD:-changeme}@db/tankbook
      SPECIES_DATA_PATH: /app/species-data
      IMAGES_PATH: /app/images
    volumes:
      - species_data:/app/species-data
      - tankbook-images:/app/images
    ports:
      - 3030:3000
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == rpi-1
      restart_policy:
        condition: on-failure
      labels:
        - "diun.enable=true"

        #Enable Traefik
        - "traefik.enable=true"
        
        # Network Traefik should use
        - "traefik.swarm.network=diagon-alley"
        
        # HTTP router
        - "traefik.http.routers.tankbook.rule=Host(`tankbook.hogwartsnetwork.co.uk`)"
        - "traefik.http.routers.tankbook.entrypoints=websecure"
        - "traefik.http.routers.tankbook.tls=true"
        - "traefik.http.routers.tankbook.tls.certresolver=cloudflare"

        # Rackpad listens on 3000 internally
        - "traefik.http.services.tankbook.loadbalancer.server.port=3000"

volumes:
  postgres_data:
  species_data:
  tankbook-images:

networks:
  diagon-alley:
    external: true

  tankbook-internal:
    external: false

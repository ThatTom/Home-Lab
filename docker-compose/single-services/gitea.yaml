services:
  server:
    image: docker.gitea.com/gitea:1.27.2
    container_name: gitea
    restart: always
    networks:
      - diagon-alley
    volumes:
      - gitea:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    # ports:
     # - "3000:3000"
     # - "222:22"
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == srv-01
      labels:
        # Enable Traefik
        - "traefik.enable=true"
        # Tell Traefik which network to use
        - "traefik.swarm.network=diagon-alley"
        # HTTP router
        - "traefik.http.routers.gitea.rule=Host(`git.hogwartsnetwork.co.uk`)"
        - "traefik.http.routers.gitea.entrypoints=websecure"
        # HTTPS
        - "traefik.http.routers.gitea.tls=true"
        # Paperless internal port
        - "traefik.http.services.gitea.loadbalancer.server.port=3000"
      restart_policy:
        condition: on-failure

volumes:
  gitea:

networks:
  diagon-alley:
    external: true

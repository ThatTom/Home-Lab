# Homepage services, mounted as a Swarm config (docker-compose/single-services/homepage.yaml).
# Swarm configs can't change in place, so bump the config name's suffix there after editing this file.
# Web services link to their Traefik hostname; devices and servers are checked by ping.
- Media:
    - Jellyfin:
        href: https://jellyfin.hogwartsnetwork.co.uk
        description: Films, shows, music and books
        icon: sh-jellyfin.svg

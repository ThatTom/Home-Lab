services:
  app:
    image: mauriceboe/trek:v3.4.1
    container_name: trek
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    environment:
      - NODE_ENV=production
      - PORT=3000
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}   # generate with: openssl rand -hex 32
      - TZ=${TZ:-UTC}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      - APP_URL=${APP_URL:-}                 # required for OIDC + email links
      # - FORCE_HTTPS=true                   # behind a TLS-terminating proxy
      - TRUST_PROXY=1
      # - OIDC_ISSUER=https://auth.example.com
      # - OIDC_CLIENT_ID=trek
      # - OIDC_CLIENT_SECRET=supersecret
      # - OIDC_DISPLAY_NAME=SSO
      # - OIDC_ADMIN_CLAIM=groups
      # - OIDC_ADMIN_VALUE=app-trek-admins
    volumes:
      - trek-data:/app/data
      - trek-uploads:/app/uploads
    networks:
      - diagon-alley
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
        replicas: 1
        placement:
          constraints:
            - node.hostname == srv-01
        labels:
          # Enable Traefik
          - "traefik.enable=true"
          # Tell Traefik which network to use
          - "traefik.swarm.network=diagon-alley"
          # HTTP router
          - "traefik.http.routers.trek.rule=Host(`travel.hogwartsnetwork.co.uk`)"
          - "traefik.http.routers.trek.entrypoints=websecure"
          # HTTPS
          - "traefik.http.routers.trek.tls=true"
          # Paperless internal port
          - "traefik.http.services.trek.loadbalancer.server.port=3000"
        restart_policy:
          condition: on-failure

volumes:
  trek-data:
    external: false
    name: trek-data

  trek-uploads:
    external: false
    name: trek-uploads

networks:
  diagon-alley:
    external: true

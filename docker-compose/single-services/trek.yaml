services:
  app:
    image: mauriceboe/trek:4.3.1
    container_name: trek
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    environment:
      NODE_ENV: production
      PORT: 3000
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      TZ: Europe/London
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Reverse proxy / public URL
      ALLOWED_ORIGINS: https://travel.hogwartsnetwork.co.uk
      APP_URL: https://travel.hogwartsnetwork.co.uk
      FORCE_HTTPS: "true"
      TRUST_PROXY: 1
    volumes:
      - trek-data:/app/data
      - trek-uploads:/app/uploads
    networks:
      - diagon-alley
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == srv-01
      restart_policy:
        condition: on-failure
      labels:
        # Traefik
        - "traefik.enable=true"
        - "traefik.swarm.network=diagon-alley"
        # Router
        - "traefik.http.routers.trek.rule=Host(`travel.hogwartsnetwork.co.uk`)"
        - "traefik.http.routers.trek.entrypoints=websecure"
        - "traefik.http.routers.trek.tls=true"
        - "traefik.http.routers.trek.tls.certresolver=cloudflare"
        # Service
        - "traefik.http.services.trek.loadbalancer.server.port=3000"

volumes:
  trek-data:
    name: trek-data

  trek-uploads:
    name: trek-uploads

networks:
  diagon-alley:
    external: true

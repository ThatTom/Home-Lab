services:
  broker:
    image: docker.io/valkey/valkey:9-alpine
    volumes:
      - redisdata:/data
    networks:
      - paperless-internal
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == srv-01
      restart_policy:
        condition: on-failure

  webserver:
    image: ghcr.io/paperless-ngx/paperless-ngx:3.2.1
    depends_on:
      - broker
      - gotenberg
      - tika
    env_file: .env
    environment:
      PAPERLESS_CONSUMER_DELETE_DUPLICATES: "true"
      PAPERLESS_CONSUMER_RECURSIVE: "true"
      PAPERLESS_CONSUMER_POLLING_INTERVAL: 30
      PAPERLESS_REDIS: redis://broker:6379
      PAPERLESS_DBENGINE: sqlite
      PAPERLESS_TIKA_ENABLED: 1
      PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://gotenberg:3000
      PAPERLESS_TIKA_ENDPOINT: http://tika:9998
      PAPERLESS_URL: https://documents.hogwartsnetwork.co.uk
      PAPERLESS_ALLOWED_HOSTS: documents.hogwartsnetwork.co.uk
      PAPERLESS_CSRF_TRUSTED_ORIGINS: https://documents.hogwartsnetwork.co.uk
      PAPERLESS_WORKER_TIMEOUT: 86400
      PAPERLESS_TIME_ZONE: Europe/London
    ports:
      - "8800:8000"
    volumes:
      - data:/usr/src/paperless/data
      - media:/usr/src/paperless/media
      - /home/tomt/export:/usr/src/paperless/export
      - /mnt/consume:/usr/src/paperless/consume
    networks:
      - diagon-alley
      - paperless-internal
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == srv-01
      restart_policy:
        condition: on-failure
      labels:
        # Traefik
        - "traefik.enable=true"
        - "traefik.swarm.network=diagon-alley"
        # Router
        - "traefik.http.routers.paperless.rule=Host(`documents.hogwartsnetwork.co.uk`)"
        - "traefik.http.routers.paperless.entrypoints=websecure"
        - "traefik.http.routers.paperless.tls=true"
        - "traefik.http.routers.paperless.tls.certresolver=cloudflare"
        # Service
        - "traefik.http.services.paperless.loadbalancer.server.port=8000"

  gotenberg:
    image: docker.io/gotenberg/gotenberg:8.37
    # The gotenberg chromium route is used to convert .eml files. We do not
    # want to allow external content like tracking pixels or even javascript.
    command:
      - "gotenberg"
      - "--chromium-disable-javascript=true"
      - "--chromium-allow-list=file:///tmp/.*"
    networks:
      - paperless-internal
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == srv-01
      restart_policy:
        condition: on-failure

  tika:
    image: docker.io/apache/tika:3.3.1.0
    networks:
      - paperless-internal
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == srv-01
      restart_policy:
        condition: on-failure

volumes:
  data:
  media:
  redisdata:

networks:
  diagon-alley:
    external: true

  paperless-internal:
    name: paperless-internal

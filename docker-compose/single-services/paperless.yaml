services:
  broker:
    image: docker.io/valkey/valkey:9-alpine
    volumes:
      - redisdata:/data
    networks:
      - paperless-internal
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == srv-01
      restart_policy:
        condition: on-failure
        
  webserver:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    depends_on:
      - broker
      - gotenberg
      - tika
    ports:
      - 8800:8000
    volumes:
      - data:/usr/src/paperless/data
      - media:/usr/src/paperless/media
      - /home/tomt/export:/usr/src/paperless/export
      - /mnt/consume:/usr/src/paperless/consume
    env_file: .env
    environment:
      PAPERLESS_REDIS: redis://broker:6379
      PAPERLESS_DBENGINE: sqlite
      PAPERLESS_TIKA_ENABLED: 1
      PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://gotenberg:3000
      PAPERLESS_TIKA_ENDPOINT: http://tika:9998
    networks:
      - diagon-alley
      - paperless-internal
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == srv-01
      labels:
        # Enable Traefik
        - "traefik.enable=true"
        # Tell Traefik which network to use
        - "traefik.swarm.network=diagon-alley"
        # HTTP router
        - "traefik.http.routers.paperless.rule=Host(`paperless.example.com`)"
        - "traefik.http.routers.paperless.entrypoints=websecure"
        # HTTPS
        - "traefik.http.routers.paperless.tls=true"
        # Paperless internal port
        - "traefik.http.services.paperless.loadbalancer.server.port=8000"
      restart_policy:
        condition: on-failure
        
  gotenberg:
    image: docker.io/gotenberg/gotenberg:8.34
    # The gotenberg chromium route is used to convert .eml files. We do not
    # want to allow external content like tracking pixels or even javascript.
    command:
      - "gotenberg"
      - "--chromium-disable-javascript=true"
      - "--chromium-allow-list=file:///tmp/.*"
    networks:
      - paperless-internal
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == srv-01
      restart_policy:
        condition: on-failure
        
  tika:
    image: docker.io/apache/tika:latest
    networks:
      - paperless-internal
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == srv-01
      restart_policy:
        condition: on-failure
    
volumes:
  data:
  media:
  redisdata:

networks:
  diagon-alley:
    external: true

  paperless-internal:
    external: false
    name: paperless-internal

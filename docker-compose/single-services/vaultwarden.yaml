services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - type: volume
        source: docker-volumes
        target: /data/
        volume:
          subpath: vaultwarden-data # The subdirectory inside the volume
    
    deploy:
            replicas: 1
            placement:
                constraints:
                    - node.hostname == srv-01
            labels:
                - "traefik.enable=true"
                - "traefik.docker.network=diagon-alley"
                - "traefik.http.routers.vaultwarden.rule=Host(`password.hogwartsnetwork.co.uk`)"
                - "traefik.http.routers.vaultwarden.entrypoints=websecure"
                - "traefik.http.routers.vaultwarden.tls=true"
                - "traefik.http.routers.vaultwarden.tls.certresolver=cloudflare"
                - "traefik.http.routers.vaultwarden.service=dashboard"
                - "traefik.http.services.vaultwarden.loadbalancer.server.port=8000"

networks:
    diagon-alley:
        external: true
        
docker-volumes:
    driver: local
    driver_opts:
      type: nfs
      o: addr=192.168.100.5,rw,nfsvers=4
      device: ":/mnt/Hogwarts-Vault/DockerVolumes"
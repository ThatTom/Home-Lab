services:
  vaultwarden:
    image: vaultwarden/server:1.37.4
    container_name: vaultwarden
    environment:
      DOMAIN: ${DOMAIN}
      # Purelymail, for invitations, email 2FA and new device alerts
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURITY: force_tls      # SMTP_PORT is implicit TLS
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_USERNAME}
      SMTP_FROM_NAME: Vaultwarden
    volumes:
      - vaultwarden:/data/
    networks:
      - diagon-alley
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == dobby
      restart_policy:
        condition: on-failure
      labels:
        # Traefik
        - "traefik.enable=true"
        - "traefik.swarm.network=diagon-alley"
        # Router
        - "traefik.http.routers.vaultwarden.rule=Host(`password.hogwartsnetwork.co.uk`)"
        - "traefik.http.routers.vaultwarden.entrypoints=websecure"
        - "traefik.http.routers.vaultwarden.tls=true"
        - "traefik.http.routers.vaultwarden.tls.certresolver=cloudflare"
        - "traefik.http.routers.vaultwarden.service=vaultwarden"
        # Service
        - "traefik.http.services.vaultwarden.loadbalancer.server.port=80"

volumes:
  vaultwarden:
    name: vaultwarden

networks:
  diagon-alley:
    external: true

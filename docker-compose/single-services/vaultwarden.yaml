services:
  vaultwarden:
    image: vaultwarden/server:1.37.3
    container_name: vaultwarden
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - vaultwarden:/data/
    networks:
      - diagon-alley
    restart: unless-stopped
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == srv-01
      labels:
        # Image update monitoring
        - "diun.enable=true"
        # Traefik
        - "traefik.enable=true"
        - "traefik.docker.network=diagon-alley"
        # Router
        - "traefik.http.routers.vaultwarden.rule=Host(`password.hogwartsnetwork.co.uk`)"
        - "traefik.http.routers.vaultwarden.entrypoints=websecure"
        - "traefik.http.routers.vaultwarden.tls=true"
        - "traefik.http.routers.vaultwarden.tls.certresolver=cloudflare"
        - "traefik.http.routers.vaultwarden.service=vaultwarden"
        # Service
        - "traefik.http.services.vaultwarden.loadbalancer.server.port=80"

volumes:
  vaultwarden:
    name: vaultwarden

networks:
  diagon-alley:
    external: true

services:
  gitea-runner-pi:
    image: gitea/runner:5.2.0
    environment:
      GITEA_INSTANCE_URL: https://git.hogwartsnetwork.co.uk
      GITEA_RUNNER_NAME: "{{.Node.Hostname}}"
      GITEA_RUNNER_REGISTRATION_TOKEN: ${GITEA_RUNNER_REGISTRATION_TOKEN}
    volumes:
      - gitea-runner-pi-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.platform.arch == aarch64
      restart_policy:
        condition: on-failure

  gitea-runner-lenovo:
    image: gitea/runner:5.2.0
    environment:
      GITEA_INSTANCE_URL: https://git.hogwartsnetwork.co.uk
      GITEA_RUNNER_NAME: "{{.Node.Hostname}}"
      GITEA_RUNNER_REGISTRATION_TOKEN: ${GITEA_RUNNER_REGISTRATION_TOKEN}
    volumes:
      - gitea-runner-lenovo-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.platform.arch == x86_64
      restart_policy:
        condition: on-failure

volumes:
  gitea-runner-pi-data:
    name: gitea-runner-pi-data

  gitea-runner-lenovo-data:
    name: gitea-runner-lenovo-data

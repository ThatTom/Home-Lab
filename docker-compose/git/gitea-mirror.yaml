services:
  gitea-mirror:
    image: ghcr.io/raylabshq/gitea-mirror:v3.40.3
    environment:
      TZ: Europe/London
      NODE_ENV: production
      DATABASE_URL: file:data/gitea-mirror.db
      HOST: 0.0.0.0
      PORT: 4321
      # Auth
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: https://gitea-mirror.hogwartsnetwork.co.uk
      PUBLIC_BETTER_AUTH_URL: https://gitea-mirror.hogwartsnetwork.co.uk
      BETTER_AUTH_TRUSTED_ORIGINS: https://gitea-mirror.hogwartsnetwork.co.uk
      AUTH_ALLOW_SIGNUP: "false"
      # GitHub
      GITHUB_USERNAME: ${GITHUB_USERNAME}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      PRIVATE_REPOSITORIES: ${PRIVATE_REPOSITORIES:-false}
      MIRROR_STARRED: ${MIRROR_STARRED:-false}
      MIRROR_ORGANIZATIONS: ${MIRROR_ORGANIZATIONS:-false}
      # Gitea
      GITEA_URL: https://git.hogwartsnetwork.co.uk
      GITEA_USERNAME: ${GITEA_USERNAME}
      GITEA_TOKEN: ${GITEA_TOKEN}
      GITEA_ORGANIZATION: ${GITEA_ORGANIZATION:-github-mirrors}
      GITEA_ORG_VISIBILITY: ${GITEA_ORG_VISIBILITY:-private}
      # Scheduling
      SCHEDULE_ENABLED: ${SCHEDULE_ENABLED:-true}
      GITEA_MIRROR_INTERVAL: ${GITEA_MIRROR_INTERVAL:-8h}
      AUTO_IMPORT_REPOS: ${AUTO_IMPORT_REPOS:-true}
      AUTO_MIRROR_REPOS: ${AUTO_MIRROR_REPOS:-true}
      # Cleanup
      CLEANUP_DELETE_IF_NOT_IN_GITHUB: ${CLEANUP_DELETE_IF_NOT_IN_GITHUB:-false}
      CLEANUP_ORPHANED_REPO_ACTION: ${CLEANUP_ORPHANED_REPO_ACTION:-archive}
      CLEANUP_DRY_RUN: ${CLEANUP_DRY_RUN:-true}
    volumes:
      - gitea-mirror-data:/app/data
    networks:
      - diagon-alley
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4321/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == srv-01
      restart_policy:
        condition: on-failure
      labels:
        # Traefik
        - "traefik.enable=true"
        - "traefik.swarm.network=diagon-alley"
        # Router
        - "traefik.http.routers.gitea-mirror.rule=Host(`gitea-mirror.hogwartsnetwork.co.uk`)"
        - "traefik.http.routers.gitea-mirror.entrypoints=websecure"
        - "traefik.http.routers.gitea-mirror.tls=true"
        - "traefik.http.routers.gitea-mirror.tls.certresolver=cloudflare"
        # Service
        - "traefik.http.services.gitea-mirror.loadbalancer.server.port=4321"

volumes:
  gitea-mirror-data:
    name: gitea-mirror-data

networks:
  diagon-alley:
    external: true

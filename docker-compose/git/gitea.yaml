services:
  server:
    image: gitea/gitea:28.2
    environment:
      # Webhooks only reach public hosts by default, this lets the PR webhook post to ntfy over diagon-alley
      GITEA__webhook__ALLOWED_HOST_LIST: "ntfy"
    volumes:
      - gitea:/data
      #- /etc/timezone:/etc/timezone:ro
      #- /etc/localtime:/etc/localtime:ro
    networks:
      - diagon-alley
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:3000/api/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == dobby
      restart_policy:
        condition: on-failure
      labels:
        # Traefik
        - "traefik.enable=true"
        - "traefik.swarm.network=diagon-alley"
        # Router
        - "traefik.http.routers.gitea.rule=Host(`git.hogwartsnetwork.co.uk`)"
        - "traefik.http.routers.gitea.entrypoints=websecure"
        - "traefik.http.routers.gitea.tls=true"
        - "traefik.http.routers.gitea.tls.certresolver=cloudflare"
        # Service
        - "traefik.http.services.gitea.loadbalancer.server.port=3000"
        # SSH TCP router
        - "traefik.tcp.routers.gitea-ssh.rule=HostSNI(`*`)"
        - "traefik.tcp.routers.gitea-ssh.entrypoints=gitea_ssh"
        - "traefik.tcp.routers.gitea-ssh.service=gitea-ssh-svc"
        # SSH TCP service
        - "traefik.tcp.services.gitea-ssh-svc.loadbalancer.server.port=22"

volumes:
  gitea:

networks:
  diagon-alley:
    external: true

services:
  server:
    image: gitea/gitea:1.27
    networks:
      - diagon-alley
    volumes:
      - gitea:/data
      #- /etc/timezone:/etc/timezone:ro
      #- /etc/localtime:/etc/localtime:ro
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == srv-01
      labels:
        - "diun.enable=true"
        # Enable Traefik
        - "traefik.enable=true"
        # Tell Traefik which network to use
        - "traefik.swarm.network=diagon-alley"
        # HTTP router
        - "traefik.http.routers.gitea.rule=Host(`git.hogwartsnetwork.co.uk`)"
        - "traefik.http.routers.gitea.entrypoints=websecure"
        # HTTPS
        - "traefik.http.routers.gitea.tls=true"
        - "traefik.http.routers.gitea.tls.certresolver=cloudflare"
        # Paperless internal port
        - "traefik.http.services.gitea.loadbalancer.server.port=3000"
      restart_policy:
        condition: on-failure

volumes:
  gitea:

networks:
  diagon-alley:
    external: true

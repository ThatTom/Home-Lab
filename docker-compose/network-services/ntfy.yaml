services:
  ntfy:
    image: binwiederhier/ntfy:v2.30.0
    init: true # needed, if healthcheck is used. Prevents zombie processes
    command: serve
    environment:
      NTFY_BASE_URL: "https://ntfy.hogwartsnetwork.co.uk"
      NTFY_BEHIND_PROXY: "true"
      NTFY_AUTH_FILE: "/var/lib/ntfy/auth.db"
      NTFY_ENABLE_LOGIN: "true"
      NTFY_CACHE_FILE: "/var/cache/ntfy/cache.db"
      NTFY_UPSTREAM_BASE_URL: "https://ntfy.hogwartsnetwork.co.uk"
      TZ: "Europe/London"
    volumes:
      - ntfy-lib:/var/lib/ntfy
      - ntfy-cache:/var/cache/ntfy
      - ntfy-etc:/etc/ntfy
    networks:
      - diagon-alley
    healthcheck: # optional: remember to adapt the host:port to your environment
      test: ["CMD-SHELL", "wget -q --tries=1 http://localhost:80/v1/health -O - | grep -Eo '\"healthy\"\\s*:\\s*true' || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == dumbledore
      restart_policy:
        condition: on-failure
      labels:
        # Traefik
        - "traefik.enable=true"
        - "traefik.swarm.network=diagon-alley"
        # Router
        - "traefik.http.routers.ntfy.rule=Host(`ntfy.hogwartsnetwork.co.uk`)"
        - "traefik.http.routers.ntfy.entrypoints=websecure"
        - "traefik.http.routers.ntfy.tls=true"
        - "traefik.http.routers.ntfy.tls.certresolver=cloudflare"
        # Service
        - "traefik.http.services.ntfy.loadbalancer.server.port=80"

volumes:
  ntfy-lib:
    name: ntfy-lib

  ntfy-cache:
    name: ntfy-cache

  ntfy-etc:
    name: ntfy-etc

networks:
  diagon-alley:
    external: true

services:
  termix:
    image: ghcr.io/lukegus/termix:beta-2.8.0-beta.20260831
    environment:
      TZ: Europe/London
    volumes:
      - termix-data:/app/data:nocopy
    networks:
      - diagon-alley
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      labels:
        # Traefik
        - "traefik.enable=true"
        - "traefik.swarm.network=diagon-alley"
        # Router
        - "traefik.http.routers.termix.rule=Host(`terminal.hogwartsnetwork.co.uk`)"
        - "traefik.http.routers.termix.entrypoints=websecure"
        - "traefik.http.routers.termix.tls=true"
        - "traefik.http.routers.termix.tls.certresolver=cloudflare"
        # Service
        - "traefik.http.services.termix.loadbalancer.server.port=8080"

volumes:
  termix-data:
    name: termix-data
    driver: local
    driver_opts:
      type: nfs
      o: "addr=192.168.100.30,rw,nfsvers=4,hard"
      device: ":/mnt/Hogwarts-Vault/Termix"

networks:
  diagon-alley:
    external: true

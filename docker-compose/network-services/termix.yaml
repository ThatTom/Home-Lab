services:
  termix:
    image: ghcr.io/lukegus/termix:26.11.2
    environment:
      TZ: UTC
    volumes:
      - termix-local:/app/data
    networks:
      - diagon-alley
    deploy:
      replicas: 1
      placement:
        constraints:
          # Data is on winky's local disk (backed up by Rustic)
          - node.hostname == winky
      restart_policy:
        condition: on-failure
      labels:
        # Traefik
        - "traefik.enable=true"
        - "traefik.swarm.network=diagon-alley"
        # Router
        - "traefik.http.routers.termix.rule=Host(`terminal.hogwartsnetwork.co.uk`)"
        - "traefik.http.routers.termix.entrypoints=websecure"
        - "traefik.http.routers.termix.tls=true"
        - "traefik.http.routers.termix.tls.certresolver=cloudflare"
        # Service
        - "traefik.http.services.termix.loadbalancer.server.port=8080"

volumes:
  # Local, not the old termix-data NFS volume, which still exists on every node under that name.
  # Its plugin sandbox writes files as other users, which the NFS share refuses.
  termix-local:
    name: termix-local

networks:
  diagon-alley:
    external: true

services:
  termix:
    image: ghcr.io/lukegus/termix:26.10.2
    environment:
      TZ: Europe/London
    volumes:
      - termix-data:/app/data:nocopy
    networks:
      - diagon-alley
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      labels:
        # Traefik
        - "traefik.enable=true"
        - "traefik.swarm.network=diagon-alley"
        # Router
        - "traefik.http.routers.termix.rule=Host(`terminal.hogwartsnetwork.co.uk`)"
        - "traefik.http.routers.termix.entrypoints=websecure"
        - "traefik.http.routers.termix.tls=true"
        - "traefik.http.routers.termix.tls.certresolver=cloudflare"
        # Service
        - "traefik.http.services.termix.loadbalancer.server.port=8080"

volumes:
  termix-data:
    name: termix-data
    external: true    # NFS share, created on every node by ansible/swarm.yml

networks:
  diagon-alley:
    external: true

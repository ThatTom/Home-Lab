services:
  technitium:
    image: technitium/dns-server:15.5.1
    hostname: technitium
    environment:
      DNS_SERVER_DOMAIN: dns.hogwartsnetwork.co.uk
      DNS_SERVER_LOG_USING_LOCAL_TIME: "true"
    ports:
      - target: 53
        published: 53
        protocol: tcp
        mode: host
      - target: 53
        published: 53
        protocol: udp
        mode: host
    volumes:
      - technitium_config:/etc/dns
    networks:
      - diagon-alley
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == rpi-2
      labels:
        # Image update monitoring
        - "diun.enable=true"
        # Traefik
        - "traefik.enable=true"
        - "traefik.docker.network=diagon-alley"
        # Router
        - "traefik.http.routers.technitium.rule=Host(`dns.hogwartsnetwork.co.uk`)"
        - "traefik.http.routers.technitium.entrypoints=websecure"
        - "traefik.http.routers.technitium.tls=true"
        # Service
        - "traefik.http.services.technitium.loadbalancer.server.port=5380"

volumes:
  technitium_config:

networks:
  diagon-alley:
    external: true

services:
  wgdashboard:
    image: ghcr.io/wgdashboard/wgdashboard:v4.3.4
    cap_add:
      - NET_ADMIN
    sysctls:
      net.ipv4.ip_forward: 1
    ports:
      # Host mode so the tunnel bypasses the ingress mesh, which rewrites UDP source addresses.
      # The router forwards 51820/udp to flitwick, hence the placement constraint below.
      - target: 51820
        published: 51820
        protocol: udp
        mode: host
    volumes:
      - aconf:/etc/amnezia/amneziawg
      - conf:/etc/wireguard
      - data:/data
    networks:
      - diagon-alley
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:10086/')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == flitwick
      restart_policy:
        condition: on-failure
      labels:
        # Traefik
        - "traefik.enable=true"
        - "traefik.swarm.network=diagon-alley"
        # Router
        - "traefik.http.routers.wgdashboard.rule=Host(`wireguard.hogwartsnetwork.co.uk`)"
        - "traefik.http.routers.wgdashboard.entrypoints=websecure"
        - "traefik.http.routers.wgdashboard.tls=true"
        - "traefik.http.routers.wgdashboard.tls.certresolver=cloudflare"
        # Service
        - "traefik.http.services.wgdashboard.loadbalancer.server.port=10086"

volumes:
  # Names match the volumes Komodo's compose deploy created on flitwick, so the keys and peers carry over
  aconf:
    name: wireguard_aconf

  conf:
    name: wireguard_conf

  data:
    name: wireguard_data

networks:
  diagon-alley:
    external: true

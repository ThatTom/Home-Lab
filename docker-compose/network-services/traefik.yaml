services:
  traefik:
    image: traefik:v3.7
    hostname: traefik.hogwarts
    command:
      # Docker provider
      - "--providers.docker=true"
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=diagon-alley"
      # File provider
      - "--providers.file.directory=/opt/traefik/dynamic"   # filled by ansible/traefik-config.yml
      - "--providers.file.watch=true"
      # Docker Swarm provider
      - "--providers.swarm=true"
      - "--providers.swarm.endpoint=unix:///var/run/docker.sock"
      - "--providers.swarm.network=diagon-alley"
      - "--providers.swarm.watch=true"
      - "--providers.swarm.exposedbydefault=false"
      # EntryPoints
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.gitea_ssh.address=:2222"
      # Health check for keepalived (ansible/roles/keepalived)
      - "--entrypoints.ping.address=:8082"
      - "--ping=true"
      - "--ping.entrypoint=ping"
      # HTTP -> HTTPS
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
      # HTTPS / TLS
      - "--entrypoints.websecure.http.tls=true"
      - "--entrypoints.websecure.http.tls.certresolver=cloudflare"
      # Dashboard
      - "--api.dashboard=true"
      - "--api.insecure=true"
      # Logging
      - "--log.level=INFO"
      - "--accesslog=true"
      # Metrics
      - "--metrics.prometheus=true"
      # Use public DNS resolvers for propagation checks
      - "--certificatesresolvers.cloudflare.acme.dnschallenge.resolvers=1.1.1.1:53,8.8.8.8:53"
      # Give DNS time to propagate
      - "--certificatesresolvers.cloudflare.acme.dnschallenge.delaybeforecheck=10"
      # Cloudflare ACME DNS Challenge
      - "--certificatesresolvers.cloudflare.acme.email=admin@hogwartsnetwork.co.uk"
      - "--certificatesresolvers.cloudflare.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.cloudflare.acme.dnschallenge=true"
      - "--certificatesresolvers.cloudflare.acme.dnschallenge.provider=cloudflare"
    environment:
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN}
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: tcp
        mode: host
      - target: 2222
        published: 2222
        protocol: tcp
        mode: host
      - target: 8082
        published: 8082
        protocol: tcp
        mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-letsencrypt:/letsencrypt
      - /opt/traefik/dynamic:/opt/traefik/dynamic:ro
    networks:
      - diagon-alley
    deploy:
      # One copy on each manager, the keepalived VIP points at a healthy one
      mode: global
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
      labels:
        # Traefik
        - "traefik.enable=true"
        - "traefik.swarm.network=diagon-alley"
        # Router
        - "traefik.http.routers.traefik.rule=Host(`traefik.hogwartsnetwork.co.uk`)"
        - "traefik.http.routers.traefik.entrypoints=websecure"
        - "traefik.http.routers.traefik.tls=true"
        - "traefik.http.routers.traefik.tls.certresolver=cloudflare"
        # Service
        - "traefik.http.services.traefik.loadbalancer.server.port=8080"

volumes:
  traefik-letsencrypt:
    name: traefik-letsencrypt

networks:
  diagon-alley:
    external: true

services:
  adguard:
    image: adguard/adguardhome
    ports:
      - 3020:80
      - 53:53/tcp
      - 53:53/udp
    volumes:
      - adguard-data:/opt/adguardhome/work
      - adguard-config:/opt/adguardhome/conf
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == srv-01
      restart_policy:
        condition: on-failure

  traefik:
    image: traefik:v3.7
    environment:
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN}
    command:
    # Providers
    - "--providers.swarm=true"
    - "--providers.swarm.endpoint=unix:///var/run/docker.sock"
    - "--providers.swarm.watch=true"
    - "--providers.swarm.exposedbydefault=false"
    - "--providers.swarm.network=diagon-alley"

    # EntryPoints
    - "--entrypoints.web.address=:80"
    - "--entrypoints.websecure.address=:443"

    # HTTP -> HTTPS
    - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
    - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
    - "--entrypoints.web.http.redirections.entrypoint.permanent=true"

    # HTTPS / TLS
    - "--entrypoints.websecure.http.tls=true"
    - "--entrypoints.websecure.http.tls.certresolver=cloudflare"

    # Dashboard
    - "--api.dashboard=true"
    - "--api.insecure=true"

    # Logging
    - "--log.level=INFO"
    - "--accesslog=true"

    # Metrics
    - "--metrics.prometheus=true"

    # Cloudflare ACME DNS Challenge
    - "--certificatesresolvers.cloudflare.acme.email=admin@hogwartsnetwork.co.uk"
    - "--certificatesresolvers.cloudflare.acme.storage=/letsencrypt/acme.json"
    - "--certificatesresolvers.cloudflare.acme.dnschallenge=true"
    - "--certificatesresolvers.cloudflare.acme.dnschallenge.provider=cloudflare"
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: tcp
        mode: host
      - target: 8080
        published: 8020
        protocol: tcp
        mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-letsencrypt:/letsencrypt
    networks:
      - diagon-alley
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == rpi-1
      restart_policy:
        condition: on-failure

  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:latest
    hostname: wg-easy
    environment:
      - LANG=en
      - WG_HOST=vpn.example.com
      - PASSWORD_HASH=${WG_PASSWORD_HASH}
      - WG_PORT=51820
      - PORT=51821
      - WG_DEFAULT_DNS=1.1.1.1
      - WG_DEFAULT_ADDRESS=10.8.0.x
    volumes:
      - wg-easy-data:/etc/wireguard
    ports:
      # WireGuard VPN traffic
      - target: 51820
        published: 51820
        protocol: udp
        mode: host
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    networks:
      - traefik
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == rpi-2
      labels:
        - traefik.enable=true

        # Web UI
        - traefik.http.routers.wg-easy.rule=Host(`vpn.example.com`)
        - traefik.http.routers.wg-easy.entrypoints=websecure
        - traefik.http.routers.wg-easy.tls=true
        - traefik.http.routers.wg-easy.tls.certresolver=cloudflare

        # wg-easy Web UI listens on 51821
        - traefik.http.services.wg-easy.loadbalancer.server.port=51821

volumes:
  adguard-data:
    external: false
    name: adguard-data

  adguard-config:
    external: false
    name: adguard-config

  traefik-letsencrypt:
    external: false
    name: traefik-letsencrypt
  
  wg-easy-data:

networks:
  diagon-alley:
    external: true

  traefik:
    external: false

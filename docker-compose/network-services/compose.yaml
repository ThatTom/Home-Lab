services:
  adguard:
    image: adguard/adguardhome
    ports:
      - 3020:80
      - 53:53/tcp
      - 53:53/udp
    volumes:
      - adguard-data:/opt/adguardhome/work
      - adguard-config:/opt/adguardhome/conf
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == srv-01
      restart_policy:
        condition: on-failure

  traefik:
    image: traefik:v3.7
    environment:
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN}
    command:
    # Providers
    - "--providers.swarm=true"
    - "--providers.swarm.endpoint=unix:///var/run/docker.sock"
    - "--providers.swarm.watch=true"
    - "--providers.swarm.exposedbydefault=false"
    - "--providers.swarm.network=diagon-alley"

    # EntryPoints
    - "--entrypoints.web.address=:80"
    - "--entrypoints.websecure.address=:443"

    # HTTP -> HTTPS
    - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
    - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
    - "--entrypoints.web.http.redirections.entrypoint.permanent=true"

    # HTTPS / TLS
    - "--entrypoints.websecure.http.tls=true"
    - "--entrypoints.websecure.http.tls.certresolver=cloudflare"

    # Dashboard
    - "--api.dashboard=true"
    - "--api.insecure=true"

    # Logging
    - "--log.level=INFO"
    - "--accesslog=true"

    # Metrics
    - "--metrics.prometheus=true"

    # Cloudflare ACME DNS Challenge
    - "--certificatesresolvers.cloudflare.acme.email=admin@hogwartsnetwork.co.uk"
    - "--certificatesresolvers.cloudflare.acme.storage=/letsencrypt/acme.json"
    - "--certificatesresolvers.cloudflare.acme.dnschallenge=true"
    - "--certificatesresolvers.cloudflare.acme.dnschallenge.provider=cloudflare"
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: tcp
        mode: host
      - target: 8080
        published: 8020
        protocol: tcp
        mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-letsencrypt:/letsencrypt
    networks:
      - diagon-alley
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == rpi-1
      restart_policy:
        condition: on-failure

  wgdashboard:
    image: ghcr.io/wgdashboard/wgdashboard:latest
    networks:
      - diagon-alley
    ports:
      - target: 51820
        published: 51820
        protocol: tcp
        mode: host
    volumes:
      - aconf:/etc/amnezia/amneziawg
      - conf:/etc/wireguard
      - data:/data
    cap_add:
      - NET_ADMIN
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == rpi-2
      labels:
        # Enable Traefik
        - "traefik.enable=true"
        # Tell Traefik which network to use
        - "traefik.swarm.network=diagon-alley"
        # HTTP router
        - "traefik.http.routers.wireguard.rule=Host(`wireguard.hogwartsnetwork.co.uk`)"
        - "traefik.http.routers.wireguard.entrypoints=websecure"
        # HTTPS
        - "traefik.http.routers.wireguard.tls=true"
        - "traefik.http.routers.wireguard.tls.certresolver=cloudflare"
        # Paperless internal port
        - "traefik.http.services.wireguard.loadbalancer.server.port=10086"
      restart_policy:
        condition: on-failure

volumes:
  adguard-data:
    external: false
    name: adguard-data

  adguard-config:
    external: false
    name: adguard-config

  traefik-letsencrypt:
    external: false
    name: traefik-letsencrypt

  aconf:
    external: false
    name: aconf

  conf:
    external: false
    name: conf

  data:
    external: false
    name: data
  
networks:
  diagon-alley:
    external: true

services:
  jellyfin:
    image: ghcr.io/jellyfin/jellyfin:10.11.11
    volumes:
      # Uses the docker volumes configured in the volumes section below to persist Jellyfin configuration and cache data
      - jellyfin-config:/config     
      - jellyfin-cache:/cache

      # Uses the shared bind mounts configured in the volumes section below to access media on the host
      - movies:/movies
      - shows:/shows
      - books:/books
      - music:/music
    networks:
      - media
      - diagon-alley
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.media == yes
      restart_policy:
        condition: on-failure
      labels:
        # Enable DIUN monitoring    
        - "diun.enable=true"
        # Enable Traefik
        - "traefik.enable=true"
        # Tell Traefik which network to use
        - "traefik.swarm.network=diagon-alley"
        # HTTP router
        - "traefik.http.routers.jellyfin.rule=Host(`jellyfin.hogwartsnetwork.co.uk`)"
        - "traefik.http.routers.jellyfin.entrypoints=websecure"
        # HTTPS
        - "traefik.http.routers.jellyfin.tls=true"
        - "traefik.http.routers.jellyfin.tls.certresolver=cloudflare"
        # Paperless internal port
        - "traefik.http.services.jellyfin.loadbalancer.server.port=8096"

volumes:
  jellyfin-config:
    external: false
    name: jellyfin-config

  jellyfin-cache:
    external: false
    name: jellyfin-cache

  movies:
    driver: local
    driver_opts:
      type: none
      device: /mnt/movies
      o: bind

  shows:
    driver: local
    driver_opts:
      type: none
      device: /mnt/shows
      o: bind

  books:
    driver: local
    driver_opts:
      type: none
      device: /mnt/books
      o: bind

  music:
    driver: local
    driver_opts:
      type: none
      device: /mnt/music
      o: bind

networks:
  media:
    external: true

  diagon-alley:
    external: true
services:
  jellyfin:
    image: ghcr.io/jellyfin/jellyfin:10.11.11
    volumes:
      # Uses the docker volumes configured in the volumes section below to persist Jellyfin configuration and cache data
      - jellyfin-config:/config
      - jellyfin-cache:/cache
      # Uses the NFS volumes configured in the volumes section below to access media on the NAS
      - movies:/movies
      - shows:/shows
      - books:/books
      - music:/music
    networks:
      - media
      - diagon-alley
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.media == yes
      restart_policy:
        condition: on-failure
      labels:
        # Traefik
        - "traefik.enable=true"
        - "traefik.swarm.network=diagon-alley"
        # Router
        - "traefik.http.routers.jellyfin.rule=Host(`jellyfin.hogwartsnetwork.co.uk`)"
        - "traefik.http.routers.jellyfin.entrypoints=websecure"
        - "traefik.http.routers.jellyfin.tls=true"
        - "traefik.http.routers.jellyfin.tls.certresolver=cloudflare"
        # Service
        - "traefik.http.services.jellyfin.loadbalancer.server.port=8096"

volumes:
  jellyfin-config:
    name: jellyfin-config

  jellyfin-cache:
    name: jellyfin-cache

  movies:
    name: media-movies
    driver: local
    driver_opts:
      type: nfs
      o: "addr=192.168.100.30,rw,nfsvers=4,hard"
      device: ":/mnt/Hogwarts-Vault/Movies"

  shows:
    name: media-shows
    driver: local
    driver_opts:
      type: nfs
      o: "addr=192.168.100.30,rw,nfsvers=4,hard"
      device: ":/mnt/Hogwarts-Vault/Shows"

  books:
    name: media-books
    driver: local
    driver_opts:
      type: nfs
      o: "addr=192.168.100.30,rw,nfsvers=4,hard"
      device: ":/mnt/Hogwarts-Vault/Books"

  music:
    name: media-music
    driver: local
    driver_opts:
      type: nfs
      o: "addr=192.168.100.30,rw,nfsvers=4,hard"
      device: ":/mnt/Hogwarts-Vault/Music"

networks:
  media:
    external: true

  diagon-alley:
    external: true

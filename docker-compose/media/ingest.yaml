services:
  makemkv:
    image: jlesage/makemkv
    ports:
      - "5800:5800"
    volumes:
      - makemkv-config:/config:rw"
      # - "/home/user:/storage:ro"
      - ingest:/output:rw"
    devices:
      - "/dev/sr0:/dev/sr0"
      - "/dev/sg2:/dev/sg2"
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == srv-lo-5
      restart_policy:
        condition: on-failure

volumes:
  makemkv-config:
    external: false
    name: makemkv-config

  ingest:
    external: false
    name: ingest
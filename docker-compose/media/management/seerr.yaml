services:
  seerr:
    image: ghcr.io/seerr-team/seerr:v3.4.1
    init: true
    container_name: seerr
    environment:
      - LOG_LEVEL=debug
      - TZ=Europe/London
      - PORT=5055 #optional
    volumes:
      # Uses the docker volumes configured in the volumes section below to persist Seerr configuration data
      - seerr-config:/app/config
    networks:
      - media
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.media == yes
      restart_policy:
        condition: on-failure
      labels:
        # Enable DIUN monitoring    
        - "diun.enable=true"
        # Enable Traefik
        - "traefik.enable=true"
        # Tell Traefik which network to use
        - "traefik.swarm.network=diagon-alley"
        # HTTP router
        - "traefik.http.routers.jellyfin.rule=Host(`seerr.hogwartsnetwork.co.uk`)"
        - "traefik.http.routers.jellyfin.entrypoints=websecure"
        # HTTPS
        - "traefik.http.routers.jellyfin.tls=true"
        - "traefik.http.routers.jellyfin.tls.certresolver=cloudflare"
        # Paperless internal port
        - "traefik.http.services.jellyfin.loadbalancer.server.port=5055"

volumes:
  seerr-config:
    external: false
    name: seerr-config

networks:
  diagon-alley:
    external: true
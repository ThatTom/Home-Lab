services:
  seerr:
    image: ghcr.io/seerr-team/seerr:v3.5.1
    init: true
    environment:
      LOG_LEVEL: debug
      TZ: UTC
      PORT: 5055 #optional
    volumes:
      # Uses the docker volumes configured in the volumes section below to persist Seerr configuration data
      - seerr-config:/app/config
    networks:
      - media
      - diagon-alley
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.media == yes
      restart_policy:
        condition: on-failure
      labels:
        # Traefik
        - "traefik.enable=true"
        - "traefik.swarm.network=diagon-alley"
        # Router
        - "traefik.http.routers.seerr.rule=Host(`seerr.hogwartsnetwork.co.uk`)"
        - "traefik.http.routers.seerr.entrypoints=websecure"
        - "traefik.http.routers.seerr.tls=true"
        - "traefik.http.routers.seerr.tls.certresolver=cloudflare"
        # Service
        - "traefik.http.services.seerr.loadbalancer.server.port=5055"

volumes:
  seerr-config:
    name: seerr-config

networks:
  media:
    external: true

  diagon-alley:
    external: true

services:
  sonarr:
    image: ghcr.io/hotio/sonarr:release-4.0.19.2979
    environment:
      PUID: 0
      PGID: 0
      UMASK: "002"
      TZ: Europe/London
      WEBUI_PORTS: 8989/tcp
    volumes:
      - sonarr-config:/config
      - shows:/shows
    networks:
      - media
      - diagon-alley
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.media == yes
      restart_policy:
        condition: on-failure
      labels:
        # Traefik
        - "traefik.enable=true"
        - "traefik.swarm.network=diagon-alley"
        # Router
        - "traefik.http.routers.sonarr.rule=Host(`sonarr.hogwartsnetwork.co.uk`)"
        - "traefik.http.routers.sonarr.entrypoints=websecure"
        - "traefik.http.routers.sonarr.tls=true"
        - "traefik.http.routers.sonarr.tls.certresolver=cloudflare"
        # Service
        - "traefik.http.services.sonarr.loadbalancer.server.port=8989"

volumes:
  sonarr-config:
    name: sonarr-config

  shows:
    name: media-shows
    driver: local
    driver_opts:
      type: nfs
      o: "addr=192.168.100.30,rw,nfsvers=4,hard"
      device: ":/mnt/Hogwarts-Vault/Shows"

networks:
  media:
    external: true

  diagon-alley:
    external: true

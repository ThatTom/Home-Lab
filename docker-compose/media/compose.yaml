services:
  jellyfin:
    image: ghcr.io/jellyfin/jellyfin:10.11.11
    ports:
      - 8096:8096
    volumes:
      # Uses the docker volumes configured in the volumes section below to persist Jellyfin configuration and cache data
      - jellyfin-config:/config
      - jellyfin-cache:/cache

      # Uses the shared bind mounts configured in the volumes section below to access media on the host
      - /mnt/movies:/media/movies
      - /mnt/shows:/media/shows
      - /mnt/books:/media/books
      - /mnt/music:/media/music
    networks:
      - media
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.media == yes
      restart_policy:
        condition: on-failure

  seerr:
    image: ghcr.io/seerr-team/seerr:v3.3.0
    init: true
    container_name: seerr
    environment:
      - LOG_LEVEL=debug
      - TZ=Europe/London
      - PORT=5055 #optional
    ports:
      - 5055:5055
    volumes:
      # Uses the docker volumes configured in the volumes section below to persist Seerr configuration data
      - seerr-config:/app/config
    networks:
      - media
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    restart: unless-stopped
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.media == yes
      restart_policy:
        condition: on-failure
    
volumes:
  jellyfin-config:
    external: false
    name: jellyfin-config

  jellyfin-cache:
    external: false
    name: jellyfin-cache

  seerr-config:
    external: false
    name: seerr-config

networks:
  media:
    driver: overlay
    # attachable: true
    external: false

services:
  jellyfin:
    image: ghcr.io/jellyfin/jellyfin:10.11.11
    ports:
      - "8096:8096/tcp"
    volumes:
      # Uses the docker volumes configured in the volumes section below to persist Jellyfin configuration and cache data
      - jellyfin-config:/config

      #- type: volume
      #  source: docker-volumes
      #  target: /config
      #  volume:
      #    subpath: jellyfin-config # The subdirectory inside the volume

      - jellyfin-cache:/cache

      # Uses the shared bind mounts configured in the volumes section below to access media on the host
      - movies:/movies
      - shows:/shows
      - books:/books
      - music:/music
    networks:
      - media
      - diagon-alley
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.media == yes
      restart_policy:
        condition: on-failure
      labels:
        # Image update monitoring
        - "diun.enable=true"
        # Traefik
        - "traefik.enable=true"
        - "traefik.swarm.network=diagon-alley"
        # Router
        - "traefik.http.routers.jellyfin.rule=Host(`jellyfin.hogwartsnetwork.co.uk`)"
        - "traefik.http.routers.jellyfin.entrypoints=websecure"
        - "traefik.http.routers.jellyfin.tls=true"
        - "traefik.http.routers.jellyfin.tls.certresolver=cloudflare"
        # Service
        - "traefik.http.services.jellyfin.loadbalancer.server.port=8096"

  seerr:
    image: ghcr.io/seerr-team/seerr:v3.5.0
    container_name: seerr
    init: true
    environment:
      LOG_LEVEL: debug
      TZ: Europe/London
      PORT: 5055 #optional
    ports:
      - "5055:5055"
    volumes:
      # Uses the docker volumes configured in the volumes section below to persist Seerr configuration data
      - seerr-config:/app/config
    networks:
      - media
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.media == yes
      restart_policy:
        condition: on-failure

  radarr:
    image: ghcr.io/hotio/radarr:release-6.3.0.10514
    container_name: radarr
    environment:
      PUID: 0
      PGID: 0
      UMASK: "002"
      TZ: Europe/London
      WEBUI_PORTS: 7878/tcp
    ports:
      - "7878:7878"
    volumes:
      - radarr-config:/config
      - movies:/movies
    networks:
      - media
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.media == yes
      restart_policy:
        condition: on-failure

  sonarr:
    image: ghcr.io/hotio/sonarr:release-4.0.19.2979
    container_name: sonarr
    environment:
      PUID: 0
      PGID: 0
      UMASK: "002"
      TZ: Europe/London
      WEBUI_PORTS: 8989/tcp
    ports:
      - "8989:8989"
    volumes:
      - sonarr-config:/config
      - shows:/shows
    networks:
      - media
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.media == yes
      restart_policy:
        condition: on-failure

volumes:
  jellyfin-config:
    name: jellyfin-config

  #docker-volumes:
  #  driver: local
  #  driver_opts:
  #    type: nfs
  #    o: addr=192.168.100.5,rw,nfsvers=4
  #    device: ":/mnt/Hogwarts-Vault/DockerVolumes"

  seerr-config:
    name: seerr-config

  radarr-config:
    name: radarr-config

  sonarr-config:
    name: sonarr-config

  jellyfin-cache:
    name: jellyfin-cache

  movies:
    driver: local
    driver_opts:
      type: none
      device: /mnt/movies
      o: bind

  shows:
    driver: local
    driver_opts:
      type: none
      device: /mnt/shows
      o: bind

  books:
    driver: local
    driver_opts:
      type: none
      device: /mnt/books
      o: bind

  music:
    driver: local
    driver_opts:
      type: none
      device: /mnt/music
      o: bind

networks:
  media:
    driver: overlay
    # attachable: true

  diagon-alley:
    external: true

###########################################
# 🦎 KOMODO CORE - SWARM STACK (FERRETDB) #
###########################################
## Deploys Postgres + FerretDB + Komodo Core, pinned to rpi-1.
## Periphery is a separate stack - see periphery-stack.yml.
##
## One-time, before first deploy (shared network for Core <-> Periphery):
##   docker network create -d overlay --attachable komodo-link
##
## Deploy from rpi-1 (stack name MUST be "komodo" to reuse existing volumes):
##   cd ~/komodo
##   set -a; . ./core.env; set +a
##   docker stack deploy -c komodo-stack.yml komodo --detach=false

services:
  postgres:
    # 🚨 Pin to a specific version. Updates can be breaking.
    image: ghcr.io/ferretdb/postgres-documentdb
    networks:
      - komodo-core-internal
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${KOMODO_DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${KOMODO_DATABASE_PASSWORD}
      POSTGRES_DB: postgres
    deploy:
      placement:
        constraints:
          - node.hostname == rpi-1
      restart_policy:
        condition: any
      labels:
        komodo.skip: ""

  ferretdb:
    # 🚨 Pin to a specific version. Updates can be breaking.
    image: ghcr.io/ferretdb/ferretdb
    networks:
      - komodo-core-internal
    volumes:
      - ferretdb-state:/state
    environment:
      FERRETDB_POSTGRESQL_URL: postgres://${KOMODO_DATABASE_USERNAME}:${KOMODO_DATABASE_PASSWORD}@postgres:5432/postgres
    deploy:
      placement:
        constraints:
          - node.hostname == rpi-1
      restart_policy:
        condition: any
        delay: 5s
      labels:
        komodo.skip: ""

  core:
    image: ghcr.io/moghtech/komodo-core:${COMPOSE_KOMODO_IMAGE_TAG:-2}
    init: true
    ports:
      - 9120:9120   # fallback access if Traefik is down
    env_file: ./core.env
    networks:
      - komodo-core-internal
      - diagon-alley
      - komodo-link
    environment:
      KOMODO_DATABASE_ADDRESS: ferretdb:27017
      # Everything else (host, OIDC, secrets) comes from core.env
    volumes:
      - keys:/config/keys
      - ${COMPOSE_KOMODO_BACKUPS_PATH}:/backups
    deploy:
      placement:
        constraints:
          - node.hostname == rpi-1   # keys volume + backups path live here
      restart_policy:
        condition: any
        delay: 10s                   # retries until ferretdb + diagon-alley are up
      labels:
        komodo.skip: ""
        traefik.enable: "true"
        traefik.swarm.network: diagon-alley   # match whatever your other swarm stacks use
        traefik.http.routers.komodo.rule: Host(`komodo.hogwartsnetwork.co.uk`)
        traefik.http.routers.komodo.entrypoints: websecure
        traefik.http.routers.komodo.tls: "true"
        traefik.http.routers.komodo.tls.certresolver: cloudflare
        traefik.http.services.komodo.loadbalancer.server.port: "9120"

volumes:
  postgres-data:
  ferretdb-state:
  keys:

networks:
  diagon-alley:
    external: true
  komodo-link:
    external: true
  komodo-core-internal:
    driver: overlay
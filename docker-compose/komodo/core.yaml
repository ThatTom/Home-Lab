###########################################
# 🦎 KOMODO CORE - SWARM STACK (FERRETDB) #
###########################################
## Deploys Postgres + FerretDB + Komodo Core, pinned to dumbledore.
## Periphery is a separate stack - see periphery.yaml.
##
## Deployed by ansible/komodo.yml, which copies this file to ~/komodo/komodo-core.yml on dumbledore
## (next to core.env) and redeploys it when it changes. The komodo-link network comes from ansible/swarm.yml.
##
## By hand from dumbledore (stack name MUST be "komodo" to reuse existing volumes):
##   cd ~/komodo
##   set -a; . ./core.env; set +a
##   docker stack deploy -c komodo-core.yml komodo --detach=false

services:
  postgres:
    # 🚨 Pin to a specific version. Updates can be breaking.
    image: ghcr.io/ferretdb/postgres-documentdb
    environment:
      POSTGRES_USER: ${KOMODO_DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${KOMODO_DATABASE_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - komodo-core-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d postgres"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == dumbledore
      restart_policy:
        condition: any
      labels:
        # Komodo
        - "komodo.skip="

  ferretdb:
    # 🚨 Pin to a specific version. Updates can be breaking.
    image: ghcr.io/ferretdb/ferretdb
    environment:
      FERRETDB_POSTGRESQL_URL: postgres://${KOMODO_DATABASE_USERNAME}:${KOMODO_DATABASE_PASSWORD}@postgres:5432/postgres
    volumes:
      - ferretdb-state:/state
    networks:
      - komodo-core-internal
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == dumbledore
      restart_policy:
        condition: any
        delay: 5s
      labels:
        # Komodo
        - "komodo.skip="

  core:
    image: ghcr.io/moghtech/komodo-core:${COMPOSE_KOMODO_IMAGE_TAG:-2}
    init: true
    env_file: ./core.env
    environment:
      KOMODO_DATABASE_ADDRESS: ferretdb:27017
      # Everything else (host, OIDC, secrets) comes from core.env
    ports:
      - "9120:9120"   # fallback access if Traefik is down
    volumes:
      - keys:/config/keys
      - ${COMPOSE_KOMODO_BACKUPS_PATH}:/backups
    networks:
      - komodo-core-internal
      - diagon-alley
      - komodo-link
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:9120/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == dumbledore   # keys volume + backups path live here
      restart_policy:
        condition: any
        delay: 10s                   # retries until ferretdb + diagon-alley are up
      labels:
        # Traefik
        - "traefik.enable=true"
        - "traefik.swarm.network=diagon-alley"
        # Router
        - "traefik.http.routers.komodo.rule=Host(`komodo.hogwartsnetwork.co.uk`)"
        - "traefik.http.routers.komodo.entrypoints=websecure"
        - "traefik.http.routers.komodo.tls=true"
        - "traefik.http.routers.komodo.tls.certresolver=cloudflare"
        # Service
        - "traefik.http.services.komodo.loadbalancer.server.port=9120"
        # Komodo
        - "komodo.skip="

volumes:
  postgres-data:
  ferretdb-state:
  keys:

networks:
  diagon-alley:
    external: true

  komodo-link:
    external: true

  komodo-core-internal:
    driver: overlay

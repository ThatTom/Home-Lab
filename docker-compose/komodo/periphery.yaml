###############################################
# 🦎 KOMODO PERIPHERY - SWARM STACK (GLOBAL) #
###############################################
## One Periphery per node, outbound mode (Periphery dials Core).
##
## Deployed by ansible/komodo.yml after the komodo stack, which copies this file to
## ~/komodo/komodo-periphery.yml on dumbledore (next to periphery.env) and redeploys it when it changes.
##
## By hand from dumbledore, after the komodo stack is up:
##   cd ~/komodo
##   set -a; . ./periphery.env; set +a
##   docker stack deploy -c komodo-periphery.yml komodo-periphery --detach=false

services:
  periphery:
    image: ghcr.io/moghtech/komodo-periphery:${COMPOSE_KOMODO_IMAGE_TAG:-2}
    init: true
    env_file: ./periphery.env        # onboarding key, root dir, core public key
    environment:
      # Core's service name in the "komodo" stack, over the komodo-link overlay
      PERIPHERY_CORE_ADDRESS: ws://komodo_core:9120
      # Swarm template - each task connects as its node's hostname
      PERIPHERY_CONNECT_AS: "{{.Node.Hostname}}"
    volumes:
      - keys:/config/keys            # per-node volume, keeps each node's keypair
      - /var/run/docker.sock:/var/run/docker.sock
      - /proc:/proc
      - ${PERIPHERY_ROOT_DIRECTORY:-/etc/komodo}:${PERIPHERY_ROOT_DIRECTORY:-/etc/komodo}
    networks:
      - komodo-link
    deploy:
      mode: global
      restart_policy:
        condition: any
        delay: 10s
      update_config:
        parallelism: 1
        failure_action: rollback
      labels:
        # Komodo
        - "komodo.skip="

volumes:
  keys:

networks:
  komodo-link:
    external: true

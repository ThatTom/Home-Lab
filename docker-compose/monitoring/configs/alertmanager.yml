# Alertmanager config, mounted as a Swarm config (docker-compose/monitoring/prometheus.yaml).
# Swarm configs can't change in place, so bump the config name's suffix there after editing this file.
route:
  receiver: ntfy
  group_by: [alertname, instance]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h

receivers:
  - name: ntfy
    webhook_configs:
      # ntfy's built-in alertmanager template turns the webhook into a readable notification
      - url: http://ntfy/homelab-alerts?template=alertmanager
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials_file: /run/secrets/ntfy-alertmanager-token

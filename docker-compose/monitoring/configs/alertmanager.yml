# Alertmanager config, mounted as a Swarm config (docker-compose/monitoring/prometheus.yaml).
# Swarm configs can't change in place, so bump the config name's suffix there after editing this file.
route:
  receiver: ntfy
  group_by: [alertname, instance]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  routes:
    # The always-firing Watchdog pings healthchecks.io every minute instead of going to ntfy
    - matchers:
        - alertname = Watchdog
      receiver: healthchecks
      group_wait: 0s
      group_interval: 1m
      repeat_interval: 1m

receivers:
  - name: ntfy
    webhook_configs:
      # ntfy's built-in alertmanager template turns the webhook into a readable notification
      - url: http://ntfy/homelab-alerts?template=alertmanager
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials_file: /run/secrets/ntfy-alertmanager-token

  - name: healthchecks
    webhook_configs:
      # The check's ping URL, kept as a secret since anyone holding it can ping the check
      - url_file: /run/secrets/healthchecks-ping-url
        send_resolved: false

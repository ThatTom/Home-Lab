# Mounted into Grafana as a Swarm config (docker-compose/monitoring/grafana.yaml).
# Swarm configs can't change in place, so bump the config name's suffix there after editing this file.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100

  # Shows Alertmanager's alerts, silences and routes under Alerting, as it has no domain of its own.
  # Grafana's own alerts aren't sent to it, all alerting stays in Prometheus (configs/alert-rules.yml)
  - name: Alertmanager
    uid: alertmanager
    type: alertmanager
    access: proxy
    url: http://alertmanager:9093
    jsonData:
      implementation: prometheus
      handleGrafanaManagedAlerts: false

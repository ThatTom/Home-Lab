# Prometheus alert rules, mounted as a Swarm config (docker-compose/monitoring/prometheus.yaml).
# Swarm configs can't change in place, so bump the config name's suffix there after editing this file.
# Alerts go to Alertmanager, which posts them to ntfy (configs/alertmanager.yml).
groups:
  # Always firing. Alertmanager sends it to healthchecks.io, which alerts by email when it stops arriving,
  # so a dead dobby, Prometheus or Alertmanager is still noticed (configs/alertmanager.yml)
  - name: meta
    rules:
      - alert: Watchdog
        expr: vector(1)
        labels:
          severity: none
        annotations:
          summary: "Alerting pipeline heartbeat"
          description: "Always firing, its absence at healthchecks.io means alerts aren't being sent."

  - name: backups
    rules:
      - alert: BackupOverdue
        expr: time() - rustic_last_success_timestamp_seconds{task="backup"} > 26 * 3600
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }}: no successful backup in over 26 hours"
          description: "The last successful Rustic backup finished {{ $value | humanizeDuration }} ago. Check journalctl -u rustic-backup on {{ $labels.instance }}."

      - alert: BackupFailed
        expr: rustic_last_run_success{task="backup"} == 0
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }}: last backup failed"
          description: "The last Rustic backup run failed. Check journalctl -u rustic-backup on {{ $labels.instance }}."

      # node_exporter is up but has never seen a backup result, e.g. the backup timer isn't set up.
      # gringotts is left out, Rustic only runs on the Swarm nodes.
      - alert: BackupNeverReported
        expr: up{job="node", instance!="gringotts"} == 1 unless on(instance) rustic_last_run_timestamp_seconds{task="backup"}
        for: 26h
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }}: no backup has ever reported"
          description: "No Rustic backup result has been recorded in 26 hours. Check that backups.yml has run and the rustic-backup.timer is active."

      - alert: PruneOverdue
        expr: time() - rustic_last_success_timestamp_seconds{task="prune"} > 8 * 86400
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }}: Rustic prune hasn't succeeded in over 8 days"
          description: "Old snapshots are still taking space in B2. Check journalctl -u rustic-prune on {{ $labels.instance }}."

      - alert: PruneFailed
        expr: rustic_last_run_success{task="prune"} == 0
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }}: last Rustic prune failed"
          description: "Check journalctl -u rustic-prune on {{ $labels.instance }}."

      # Monthly restore test on dumbledore (ansible/restore-test.yml)
      - alert: RestoreTestFailed
        expr: restore_test_last_run_failures > 0
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }}: monthly restore test failed"
          description: "{{ $value }} checks failed. Check journalctl -u restore-test on {{ $labels.instance }}."

      - alert: RestoreTestOverdue
        expr: time() - restore_test_last_success_timestamp_seconds > 40 * 86400
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "No passing restore test in over 40 days"
          description: "The last passing restore test finished {{ $value | humanizeDuration }} ago. Check systemctl status restore-test.timer on {{ $labels.instance }}."

  - name: nodes
    rules:
      - alert: NodeExporterDown
        expr: up{job="node"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }}: not reporting metrics"
          description: "Prometheus can't reach node_exporter on {{ $labels.instance }}, the node may be down."

      - alert: DiskSpaceLow
        expr: >-
          node_filesystem_avail_bytes{fstype!~"tmpfs|ramfs|overlay|squashfs|vfat|nfs.*|fuse.*"}
          / node_filesystem_size_bytes * 100 < 15
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }}: {{ $labels.mountpoint }} below 15% free"
          description: "{{ $labels.mountpoint }} has {{ $value | printf \"%.1f\" }}% free."

      - alert: DiskSpaceCritical
        expr: >-
          node_filesystem_avail_bytes{fstype!~"tmpfs|ramfs|overlay|squashfs|vfat|nfs.*|fuse.*"}
          / node_filesystem_size_bytes * 100 < 5
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }}: {{ $labels.mountpoint }} below 5% free"
          description: "{{ $labels.mountpoint }} has {{ $value | printf \"%.1f\" }}% free."

      # patch.yml runs weekly and reboots nodes that need it, so a week means it isn't running or is skipping the node
      - alert: RebootRequired
        expr: time() - node_reboot_required_since_timestamp_seconds > 8 * 86400 and node_reboot_required == 1
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }}: has needed a reboot for over 8 days"
          description: "Updates installed {{ $value | humanizeDuration }} ago need a reboot. Run patch.yml for {{ $labels.instance }} (a run from Semaphore skips the node Semaphore is on)."

  - name: storage
    rules:
      # node_exporter's ZFS collector on gringotts, 1 on the pool's current state
      - alert: ZfsPoolUnhealthy
        expr: node_zfs_zpool_state{state!="online"} == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }}: ZFS pool {{ $labels.zpool }} is {{ $labels.state }}"
          description: "Check Storage in the TrueNAS UI, or zpool status {{ $labels.zpool }} on {{ $labels.instance }}."

      # From the zfs list textfile a TrueNAS cron job writes on gringotts. ZFS slows down past about 80% full.
      - alert: ZfsPoolSpaceLow
        expr: zfs_pool_used_bytes / (zfs_pool_used_bytes + zfs_pool_available_bytes) * 100 > 80
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }}: ZFS pool {{ $labels.zpool }} is over 80% full"
          description: "{{ $labels.zpool }} is {{ $value | printf \"%.1f\" }}% full."

  - name: logging
    rules:
      - alert: LokiDown
        expr: up{job="loki"} == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Loki is down"
          description: "No logs are being stored. Check docker service logs loki_loki."

      # A stopped Alloy drops out of DNS rather than reporting down, so compare against the Swarm nodes that are up
      - alert: LogShipperMissing
        expr: (count(up{job="alloy"} == 1) or vector(0)) < count(up{job="node", instance!="gringotts"} == 1)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Alloy isn't running on every node"
          description: "{{ $value }} Alloy copies are up, fewer than the nodes reporting metrics, so some node's logs aren't being collected. Check docker service ps loki_alloy."

  - name: probes
    rules:
      - alert: ServiceDown
        expr: probe_success{job=~"blackbox-.*"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} is down"
          description: "The {{ $labels.job }} check for {{ $labels.instance }} has failed for 5 minutes."

      - alert: CertificateExpiringSoon
        expr: probe_ssl_earliest_cert_expiry - time() < 14 * 86400
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }}: certificate expires in {{ $value | humanizeDuration }}"
          description: "Traefik normally renews 30 days before expiry, so renewal has likely stopped. Check the Traefik logs."

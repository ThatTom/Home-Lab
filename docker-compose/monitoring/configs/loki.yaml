# Mounted into Loki as a Swarm config (docker-compose/monitoring/loki.yaml).
# Swarm configs can't change in place, so bump the config name's suffix there after editing this file.
# Single binary on dobby, logs are kept on its local disk for 30 days.
auth_enabled: false

server:
  http_listen_port: 3100
  log_level: warn

common:
  # The container is on several overlay networks, so pin the ring to loopback
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: "2026-10-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 30d
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  # Room for the burst when Alloy first catches up on every node's journal and containers
  ingestion_rate_mb: 8
  ingestion_burst_size_mb: 16
  volume_enabled: true

# Deletes chunks older than retention_period
compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

analytics:
  reporting_enabled: false

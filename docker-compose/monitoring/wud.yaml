services:
  whatsupdocker:
    image: getwud/wud:9.2.0
    environment:
      WUD_AUTH_ADMIN_USER: ${WUD_AUTH_ADMIN_USER}
      WUD_AUTH_ADMIN_PASSWORD: ${WUD_AUTH_ADMIN_PASSWORD}
      WUD_WATCHER_SWARM_LOCAL_SOCKET: /var/run/docker.sock
      WUD_WATCHER_SWARM_LOCAL_CRON: "0 2 * * *"
      WUD_TRIGGER_NTFY_LOCAL_URL: https://ntfy.hogwartsnetwork.co.uk
      WUD_TRIGGER_NTFY_LOCAL_TOPIC: wud
      WUD_TRIGGER_NTFY_LOCAL_AUTH_TOKEN: ${WUD_TRIGGER_NTFY_LOCAL_AUTH_TOKEN}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - diagon-alley
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == rpi-1
      restart_policy:
        condition: on-failure
      labels:
        # Image update monitoring
        - "diun.enable=true"
        # Traefik
        - "traefik.enable=true"
        - "traefik.swarm.network=diagon-alley"
        # Router
        - "traefik.http.routers.wud.rule=Host(`wud.hogwartsnetwork.co.uk`)"
        - "traefik.http.routers.wud.entrypoints=websecure"
        - "traefik.http.routers.wud.tls=true"
        - "traefik.http.routers.wud.tls.certresolver=cloudflare"
        # Service
        - "traefik.http.services.wud.loadbalancer.server.port=3000"

networks:
  diagon-alley:
    external: true

services:
  whatsupdocker:
    image: getwud/wud:latest
    environment:
      - WUD_AUTH_ADMIN_USER=admin
      - WUD_AUTH_ADMIN_PASSWORD=MySecurePassword123
    networks:
      - diagon-alley
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == rpi-1
      labels:
        - "diun.enable=true"
        # Enable Traefik
        - "traefik.enable=true"
        # Tell Traefik which network to use
        - "traefik.swarm.network=diagon-alley"
        # HTTP router
        - "traefik.http.routers.wud.rule=Host(`wud.hogwartsnetwork.co.uk`)"
        - "traefik.http.routers.wud.entrypoints=websecure"
        # HTTPS
        - "traefik.http.routers.wud.tls=true"
        - "traefik.http.routers.wud.tls.certresolver=cloudflare"
        # Paperless internal port
        - "traefik.http.services.wud.loadbalancer.server.port=3000"
      restart_policy:
        condition: on-failure

networks:
  diagon-alley:
    external: true
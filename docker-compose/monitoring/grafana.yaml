services:
  grafana:
    image: grafana/grafana-enterprise:13.2.3
    #ports:
    #  - "3010:3000"
    volumes:
      - grafana-storage:/var/lib/grafana
    networks:
      - diagon-alley
      - monitoring-internal
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == srv-01
      restart_policy:
        condition: on-failure
      labels:
        # Traefik
        - "traefik.enable=true"
        - "traefik.swarm.network=diagon-alley"
        # Router
        - "traefik.http.routers.grafana.rule=Host(`monitoring.hogwartsnetwork.co.uk`)"
        - "traefik.http.routers.grafana.entrypoints=websecure"
        - "traefik.http.routers.grafana.tls=true"
        - "traefik.http.routers.grafana.tls.certresolver=cloudflare"
        # Service
        - "traefik.http.services.grafana.loadbalancer.server.port=3000"

volumes:
  grafana-storage:
    name: grafana-storage

networks:
  diagon-alley:
    external: true

  monitoring-internal:
    name: monitoring-internal

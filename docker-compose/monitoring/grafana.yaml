services:
  grafana:
    image: grafana/grafana-enterprise:13.2.3
    #ports:
    #  - "3010:3000"
    volumes:
      - grafana-storage:/var/lib/grafana
    configs:
      - source: grafana-datasources
        target: /etc/grafana/provisioning/datasources/datasources.yaml
      - source: grafana-dashboard-provider
        target: /etc/grafana/provisioning/dashboards/homelab.yaml
      - source: grafana-dashboard-overview
        target: /etc/grafana/dashboards/homelab-overview.json
      - source: grafana-dashboard-logs
        target: /etc/grafana/dashboards/logs.json
    networks:
      - diagon-alley
      - monitoring-internal
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == dobby
      restart_policy:
        condition: on-failure
      labels:
        # Traefik
        - "traefik.enable=true"
        - "traefik.swarm.network=diagon-alley"
        # Router
        - "traefik.http.routers.grafana.rule=Host(`monitoring.hogwartsnetwork.co.uk`)"
        - "traefik.http.routers.grafana.entrypoints=websecure"
        - "traefik.http.routers.grafana.tls=true"
        - "traefik.http.routers.grafana.tls.certresolver=cloudflare"
        # Service
        - "traefik.http.services.grafana.loadbalancer.server.port=3000"

volumes:
  grafana-storage:
    name: grafana-storage

networks:
  diagon-alley:
    external: true

  monitoring-internal:
    external: true

configs:
  grafana-datasources:
    name: grafana-datasources-v2
    file: ./configs/grafana-datasources.yaml

  grafana-dashboard-provider:
    name: grafana-dashboard-provider-v1
    file: ./configs/grafana-dashboards.yaml

  # Dashboards are mounted one config each, into the folder the provider above watches
  grafana-dashboard-overview:
    name: grafana-dashboard-overview-v5
    file: ./configs/grafana-dashboards/homelab-overview.json

  grafana-dashboard-logs:
    name: grafana-dashboard-logs-v1
    file: ./configs/grafana-dashboards/logs.json

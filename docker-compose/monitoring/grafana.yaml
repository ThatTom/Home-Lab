services:
  grafana:
    image: grafana/grafana-enterprise
    #ports:
    #  - 3010:3000
    volumes:
      - grafana-storage:/var/lib/grafana
    networks:
      - diagon-alley
      - monitoring-internal
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == srv-01
      labels:
        # Enable Traefik
        - "traefik.enable=true"
        # Tell Traefik which network to use
        - "traefik.swarm.network=diagon-alley"
        # HTTP router
        - "traefik.http.routers.grafana.rule=Host(`monitoring.hogwartsnetwork.co.uk`)"
        - "traefik.http.routers.grafana.entrypoints=websecure"
        # HTTPS
        - "traefik.http.routers.grafana.tls=true"
        - "traefik.http.routers.grafana.tls.certresolver=cloudflare"
        # Paperless internal port
        - "traefik.http.services.grafana.loadbalancer.server.port=3000"
      restart_policy:
        condition: on-failure

volumes:
  grafana-storage:
    external: false
    name: grafana-storage

networks:
  diagon-alley:
    external: true

  monitoring-internal:
    external: false
    name: monitoring-internal
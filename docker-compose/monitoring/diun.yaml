services:
  diun:
    image: crazymax/diun:4.33.0
    command: serve
    environment:
      TZ: Europe/London
      DIUN_WATCH_WORKERS: "20"
      DIUN_WATCH_SCHEDULE: "*/30 * * * *"
      DIUN_WATCH_JITTER: 30s
      DIUN_PROVIDERS_DOCKER: "true"
      DIUN_PROVIDERS_SWARM: "true"
    volumes:
      - diun-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "diun", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == rpi-1
      labels:
        # Image update monitoring
        - "diun.enable=true"

volumes:
  diun-data:
    name: diun-data

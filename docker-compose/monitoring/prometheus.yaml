services:
  prometheus:
    image: prom/prometheus:v3.15.0
    #ports:
    #  - "9090:9090"
    networks:
      - monitoring-internal
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == dobby
      restart_policy:
        condition: on-failure

networks:
  diagon-alley:
    external: true

  monitoring-internal:
    external: true
    name: monitoring-internal

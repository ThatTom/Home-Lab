services:
  prometheus:
    image: prom/prometheus:v3.15.0
    volumes:
      - prometheus-data:/prometheus
    configs:
      - source: prometheus
        target: /etc/prometheus/prometheus.yml
      - source: alert-rules
        target: /etc/prometheus/rules/alerts.yml
    networks:
      - monitoring-internal
      - diagon-alley
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == dobby
      restart_policy:
        condition: on-failure

  alertmanager:
    image: prom/alertmanager:v0.34.1
    volumes:
      - alertmanager-data:/alertmanager
    configs:
      - source: alertmanager
        target: /etc/alertmanager/alertmanager.yml
    secrets:
      - ntfy-alertmanager-token
      - healthchecks-ping-url
    networks:
      - monitoring-internal
      - diagon-alley               # reaches ntfy
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == dobby
      restart_policy:
        condition: on-failure

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.29.0
    configs:
      - source: blackbox
        target: /etc/blackbox_exporter/config.yml
    networks:
      - monitoring-internal
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:9115/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  # One per node on the host network, so it sees the host's disks and network.
  # Rustic writes its backup results to the textfile directory (ansible/roles/rustic).
  node-exporter:
    image: prom/node-exporter:v1.12.1
    command:
      - "--path.rootfs=/host"
      - "--collector.textfile.directory=/host/var/lib/node_exporter/textfile"
    volumes:
      - type: bind
        source: /
        target: /host
        read_only: true
        bind:
          propagation: rslave
    networks:
      - host
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:9100/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      mode: global
      restart_policy:
        condition: on-failure

  # One per node on the host network, per-container CPU and memory for the service panels.
  # Only the labels naming the stack and service are kept, and only CPU and memory are collected.
  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    command:
      - "--port=9338"
      - "--docker_only=true"
      - "--housekeeping_interval=30s"
      - "--enable_metrics=cpu,memory"
      - "--store_container_labels=false"
      - "--whitelisted_container_labels=com.docker.stack.namespace,com.docker.swarm.service.name,com.docker.compose.project,com.docker.compose.service"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    networks:
      - host
    deploy:
      mode: global
      restart_policy:
        condition: on-failure

volumes:
  prometheus-data:
    name: prometheus-data

  alertmanager-data:
    name: alertmanager-data

networks:
  diagon-alley:
    external: true

  monitoring-internal:
    external: true

  host:
    name: host
    external: true

configs:
  prometheus:
    name: prometheus-config-v6
    file: ./configs/prometheus.yml

  alert-rules:
    name: prometheus-alert-rules-v7
    file: ./configs/alert-rules.yml

  alertmanager:
    name: alertmanager-config-v2
    file: ./configs/alertmanager.yml

  blackbox:
    name: blackbox-config-v1
    file: ./configs/blackbox.yml

# Created by ansible/swarm.yml from the ntfy_alert_token and healthchecks_ping_url Semaphore secrets
secrets:
  ntfy-alertmanager-token:
    external: true

  healthchecks-ping-url:
    external: true

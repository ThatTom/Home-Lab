services:
  tunnel:
    image: cloudflare/cloudflared:2026.11.1
    command: tunnel --no-autoupdate run
    environment:
      # Remotely managed tunnel, public hostnames are routed in the Cloudflare Zero Trust dashboard
      # to the tcubedlabs services by their swarm name, e.g. http://solidinvoice_app:8765
      TUNNEL_TOKEN: ${TCUBEDLABS_TUNNEL_TOKEN}
      TUNNEL_METRICS: 0.0.0.0:2000
    networks:
      - tcubedlabs
    # Distroless image with no shell, so the check uses cloudflared itself against the metrics server
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "localhost:2000", "ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      # Two connectors on different nodes, so the tunnel stays up if one node goes down
      replicas: 2
      placement:
        max_replicas_per_node: 1
      restart_policy:
        condition: on-failure

networks:
  tcubedlabs:
    external: true

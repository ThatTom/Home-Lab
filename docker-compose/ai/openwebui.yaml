services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    networks:
      - diagon-alley
    environment:
      - OLLAMA_BASE_URL=192.168.100.14:11434
    volumes:
      - open-webui:/app/backend/data
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.ai == yes
      labels:
        - "diun.enable=true"
        
        - "traefik.enable=true"
        - "traefik.docker.network=diagon-alley"
      
        - "traefik.http.routers.openwebui.rule=Host(`ai.hogwartsnetwork.co.uk`)"
        - "traefik.http.routers.openwebui.entrypoints=websecure"
        - "traefik.http.routers.openwebui.tls=true"
        - "traefik.http.routers.openwebui.tls.certresolver=cloudflare"
      
        - "traefik.http.routers.openwebui.service=openwebui"
        - "traefik.http.services.openwebui.loadbalancer.server.port=8080"
      restart_policy:
        condition: on-failure

volumes:
    open-webui:
        external: false
        name: open-webui

networks:
  diagon-alley:
    external: true

services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.12.4
    environment:
      # Store the OAuth/SSO settings in the database so they can be edited in the Admin Panel
      ENABLE_OAUTH_PERSISTENT_CONFIG: "true"
    volumes:
      - open-webui:/app/backend/data
    networks:
      - diagon-alley
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.ai == yes
      restart_policy:
        condition: on-failure
      labels:
        # Traefik
        - "traefik.enable=true"
        - "traefik.swarm.network=diagon-alley"
        # Router
        - "traefik.http.routers.openwebui.rule=Host(`ai.hogwartsnetwork.co.uk`)"
        - "traefik.http.routers.openwebui.entrypoints=websecure"
        - "traefik.http.routers.openwebui.tls=true"
        - "traefik.http.routers.openwebui.tls.certresolver=cloudflare"
        - "traefik.http.routers.openwebui.service=openwebui"
        # Service
        - "traefik.http.services.openwebui.loadbalancer.server.port=8080"

volumes:
  open-webui:
    name: open-webui

networks:
  diagon-alley:
    external: true

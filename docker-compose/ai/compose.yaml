services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    ports:
      - 3040:8080
    environment:
      - OLLAMA_BASE_URL=192.168.100.14:11434
    volumes:
      - open-webui:/app/backend/data
    container_name: open-webui
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.ai == yes
      restart_policy:
        condition: on-failure

  ollama:
    image: ollama/ollama
    container_name: ollama
    volumes:
      - ollama:/root/.ollama
    ports:
      - "11434:11434"
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.ai == yes
      resources:
        reservations:
          devices:
            - driver: cdi
              device_ids:
                - nvidia.com/gpu=all
              capabilities:
                - gpu
      restart_policy:
        condition: on-failure

volumes:
    open-webui:
        external: false
        name: open-webui

    ollama:
        external: false
        name: ollama
name: renovate

on:
  schedule:
    - cron: '0 3 * * *'     # 03:00 UTC daily
  workflow_dispatch:

jobs:
  renovate:
    runs-on: ubuntu-latest
    container: renovate/renovate:44.115
    steps:
      - name: Run Renovate
        run: renovate
        env:
          RENOVATE_PLATFORM: gitea
          RENOVATE_ENDPOINT: https://git.hogwartsnetwork.co.uk/api/v1
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
          RENOVATE_REPOSITORIES: tom/homelab-stacks
          RENOVATE_GIT_AUTHOR: Renovate Bot <renovate@hogwartsnetwork.co.uk>
          RENOVATE_ONBOARDING: 'false'
          RENOVATE_REQUIRE_CONFIG: required
          GITHUB_COM_TOKEN: ${{ secrets.GH_TOKEN }}
          LOG_LEVEL: debug
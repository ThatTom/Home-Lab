# Run from Semaphore with the inventory file ansible/inventory/homelab.yml, using the ansible SSH key.
# Hosts the ansible user cannot log in to yet are set up by logging in as bootstrap_user (harry)
# with the password in the Semaphore secret variable harry_password.
# Once a host is set up, harry is disabled there and every later run uses the ansible user.
- name: Pick the login for each host
  hosts: all
  gather_facts: false
  tasks:
    # TEMP: remove once harry_password is reaching Ansible. Prints names only, never values.
    - name: TEMP show which harry and Semaphore variable names reached Ansible
      ansible.builtin.debug:
        msg:
          ansible_vars: "{{ vars.keys() | select('search', 'harry|semaphore', ignorecase=true) | map('to_json') | list }}"
          environment_vars: "{{ lookup('ansible.builtin.pipe', 'env | cut -d= -f1') | split('\n') | select('search', 'harry|semaphore', ignorecase=true) | map('to_json') | list }}"
      run_once: true

    - name: Try logging in as the ansible user
      ansible.builtin.ping:
      ignore_unreachable: true
      register: ansible_login

    - name: Fall back to the bootstrap user where the ansible user cannot log in yet
      ansible.builtin.set_fact:
        login_user: "{{ bootstrap_user if ansible_login.unreachable | default(false) else 'ansible' }}"

- name: Create consistent logins and the Ansible user
  hosts: all
  become: true
  gather_facts: false
  vars:
    # Play vars take precedence over the inventory ansible_user
    ansible_user: "{{ login_user }}"
    ansible_password: "{{ harry_password | default('') if login_user == bootstrap_user else '' }}"
    ansible_become_password: "{{ ansible_password }}"
  pre_tasks:
    - name: Make sure harry's password was passed in
      ansible.builtin.assert:
        that: harry_password | default('') | length > 0
        fail_msg: >-
          {{ inventory_hostname }} needs the {{ bootstrap_user }} login but harry_password is empty.
          Add it as a secret (environment or extra variable) in the template's Semaphore Variable Group.
      when: login_user == bootstrap_user
  roles:
    - base

- name: Disable the bootstrap user
  hosts: all
  become: true
  gather_facts: false
  vars:
    # Always the ansible user, so harry is only disabled once that login is proven to work
    ansible_user: ansible
  roles:
    - retire_users

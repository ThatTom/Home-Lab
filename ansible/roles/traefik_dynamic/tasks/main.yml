- name: Create the Traefik dynamic config directory
  ansible.builtin.file:
    path: "{{ traefik_dynamic_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Copy dynamic config files from the repo
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ traefik_dynamic_dir }}/{{ item | basename }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ query('ansible.builtin.fileglob', traefik_dynamic_src ~ '/*.yaml') }}"
  loop_control:
    label: "{{ item | basename }}"

- name: Find dynamic config files on the node
  ansible.builtin.find:
    paths: "{{ traefik_dynamic_dir }}"
    patterns: "*.yaml"
  register: traefik_dynamic_existing

# Routes deleted from the repo would otherwise stay live in Traefik
- name: Remove dynamic config files that are no longer in the repo
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ traefik_dynamic_existing.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  when: (item.path | basename) not in (query('ansible.builtin.fileglob', traefik_dynamic_src ~ '/*.yaml') | map('basename') | list)

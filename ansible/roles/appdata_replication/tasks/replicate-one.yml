- name: "{{ svc.name }} | find container on this node"
  ansible.builtin.command: >
    docker ps -q --filter label=com.docker.swarm.service.name={{ svc.name }}
  register: cid
  changed_when: false

- name: "{{ svc.name }} | sync to {{ peer }}"
  when: cid.stdout | length > 0
  block:
    - name: Pause container for a consistent copy
      ansible.builtin.command: docker pause {{ cid.stdout_lines[0] }}

    - name: Rsync appdata to peer
      ansible.builtin.command: >
        rsync -aHAX --delete --numeric-ids
        -e "ssh -i /root/.ssh/replication -o StrictHostKeyChecking=accept-new"
        {% for e in svc.excludes | default([]) %}--exclude={{ e }} {% endfor %}
        {{ svc.path }} root@{{ peer_addr }}:{{ svc.path }}
  always:
    - name: Unpause container
      ansible.builtin.command: docker unpause {{ cid.stdout_lines[0] }}
      when: cid.stdout | length > 0
      failed_when: false
- name: Install unattended-upgrades
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present
    update_cache: true
    cache_valid_time: 3600

# The distribution's own 50unattended-upgrades picks the origins: security updates on Ubuntu,
# security and stable point releases on Debian / Raspberry Pi OS (the Pi kernel and firmware aren't included)
- name: Turn on the daily security updates
  ansible.builtin.copy:
    content: |
      // Managed by Ansible (roles/updates)
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"

- name: Never reboot automatically or upgrade Docker
  ansible.builtin.copy:
    content: |
      // Managed by Ansible (roles/updates). Reboots and Docker upgrades are left to patch.yml,
      // which drains the node first.
      Unattended-Upgrade::Automatic-Reboot "false";
      Unattended-Upgrade::Remove-Unused-Dependencies "true";
      Unattended-Upgrade::Package-Blacklist {
      {% for package in updates_package_blacklist %}
          "{{ package }}";
      {% endfor %}
      };
    dest: /etc/apt/apt.conf.d/52homelab-unattended-upgrades
    owner: root
    group: root
    mode: "0644"

- name: Create the node_exporter textfile directory
  ansible.builtin.file:
    path: "{{ updates_metrics_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy the reboot-required metric script
  ansible.builtin.template:
    src: reboot-required-metric.sh.j2
    dest: /usr/local/sbin/reboot-required-metric
    owner: root
    group: root
    mode: "0755"

- name: Deploy the reboot-required metric units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: /etc/systemd/system/{{ item }}
    owner: root
    group: root
    mode: "0644"
  loop:
    - reboot-required-metric.service
    - reboot-required-metric.timer
  notify: Reload systemd

- name: Apply systemd changes now
  ansible.builtin.meta: flush_handlers

- name: Enable the reboot-required metric timer
  ansible.builtin.systemd:
    name: reboot-required-metric.timer
    enabled: true
    state: started

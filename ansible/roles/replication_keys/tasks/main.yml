# Expects `peer` from inventory/group_vars/failover_pair.yml
- name: Generate replication key
  ansible.builtin.command: ssh-keygen -t ed25519 -N "" -C "replication@{{ inventory_hostname }}" -f /root/.ssh/replication
  args:
    creates: /root/.ssh/replication

- name: Read public key
  ansible.builtin.slurp:
    src: /root/.ssh/replication.pub
  register: pubkey

- name: Authorise this host's key on its peer
  ansible.posix.authorized_key:
    user: root
    key: "{{ pubkey.content | b64decode }}"
    key_options: 'from="{{ hostvars[inventory_hostname].ansible_host | default(inventory_hostname) }}"'
  delegate_to: "{{ peer }}"

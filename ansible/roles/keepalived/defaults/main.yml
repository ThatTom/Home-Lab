# Defaults only, the VIP lives in inventory/group_vars/swarm_managers.yml
# and keepalived_priority is set per host in inventory/homelab.yml
keepalived_vip: ""
keepalived_vip_prefix: 24
keepalived_interface: "{{ ansible_facts.default_ipv4.interface }}"
keepalived_router_id: 51

# true keeps the VIP where it is when a higher priority node recovers
keepalived_nopreempt: false

# The other nodes sharing the VIP, adverts are sent unicast to them only
keepalived_peers: "{{ groups['swarm_managers'] | difference([inventory_hostname]) }}"

# Traefik's ping entrypoint (docker-compose/network-services/traefik.yaml)
keepalived_check_url: http://127.0.0.1:8082/ping

# Defaults only, the real values live in inventory/group_vars/all.yml
managed_users: []
ssh_password_authentication: false

# Public keys for each user are read from <base_ssh_key_dir>/<user>/*.pub
base_ssh_key_dir: "{{ role_path }}/files/ssh-keys"

# Every scheduled time in the repo is UTC
base_timezone: UTC

# Largest the persistent systemd journal can grow to, Loki keeps the long-term copy
base_journal_max_use: 500M

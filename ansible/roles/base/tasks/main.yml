- name: Make sure every managed user has at least one public key
  ansible.builtin.assert:
    that: query('ansible.builtin.fileglob', base_ssh_key_dir ~ '/' ~ item.name ~ '/*.pub') | length > 0
    fail_msg: "No public keys in roles/base/files/ssh-keys/{{ item.name }}/, refusing to continue to avoid a lockout"
  loop: "{{ managed_users }}"
  loop_control:
    label: "{{ item.name }}"
  run_once: true

- name: Create user
  ansible.builtin.user:
    name: "{{ item.name }}"
    shell: /bin/bash
    groups: "{{ item.groups }}"
    append: true
    create_home: true
  loop: "{{ managed_users }}"
  loop_control:
    label: "{{ item.name }}"

- name: Set authorised SSH keys (replaces any keys not in the repo)
  ansible.posix.authorized_key:
    user: "{{ item.name }}"
    key: |
      {% for f in query('ansible.builtin.fileglob', base_ssh_key_dir ~ '/' ~ item.name ~ '/*.pub') %}
      {{ lookup('ansible.builtin.file', f) }}
      {% endfor %}
    exclusive: true
  loop: "{{ managed_users }}"
  loop_control:
    label: "{{ item.name }}"

- name: Allow passwordless sudo
  ansible.builtin.copy:
    content: "{{ item.name }} ALL=(ALL) NOPASSWD:ALL\n"
    dest: "/etc/sudoers.d/{{ item.name }}"
    owner: root
    group: root
    mode: "0440"
    validate: visudo -cf %s
  loop: "{{ managed_users | selectattr('nopasswd_sudo') }}"
  loop_control:
    label: "{{ item.name }}"

- name: Apply shared SSH daemon settings
  ansible.builtin.copy:
    content: |
      # Managed by Ansible (roles/base)
      PubkeyAuthentication yes
      PasswordAuthentication {{ 'yes' if ssh_password_authentication else 'no' }}
      KbdInteractiveAuthentication no
      PermitRootLogin prohibit-password
    dest: /etc/ssh/sshd_config.d/10-homelab.conf
    owner: root
    group: root
    mode: "0644"
    validate: sshd -t -f %s
  notify: Reload sshd

# Swarm's Raft and certificates expect the nodes' clocks to agree. Ubuntu 25.10+ ships chrony,
# Debian / Raspberry Pi OS systemd-timesyncd, whichever is installed is kept
- name: Check which time sync service is installed
  ansible.builtin.package_facts:

- name: Install systemd-timesyncd where no time sync service is installed
  ansible.builtin.apt:
    name: systemd-timesyncd
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: "'chrony' not in ansible_facts.packages and 'systemd-timesyncd' not in ansible_facts.packages"

- name: Keep time sync running
  ansible.builtin.systemd:
    name: "{{ 'chrony' if 'chrony' in ansible_facts.packages else 'systemd-timesyncd' }}"
    enabled: true
    state: started

- name: Set the timezone
  community.general.timezone:
    name: "{{ base_timezone }}"

- name: Create the journald drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Cap the size of the systemd journal
  ansible.builtin.copy:
    content: |
      # Managed by Ansible (roles/base)
      [Journal]
      SystemMaxUse={{ base_journal_max_use }}
    dest: /etc/systemd/journald.conf.d/10-homelab.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart journald

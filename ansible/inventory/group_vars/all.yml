# Accounts kept identical on every host by the base role (bootstrap.yml)
# Public keys for each user are read from roles/base/files/ssh-keys/<user>/*.pub
managed_users:
  - name: tomt
    groups:
      - sudo
      - docker
    nopasswd_sudo: true
  - name: ansible
    groups: []
    nopasswd_sudo: true

# Only key based SSH logins are accepted once bootstrapped
ssh_password_authentication: false

# Bootstrap logins that get disabled once the managed users above exist.
# bootstrap.yml only does this while logged in as the ansible user, so harry
# stays usable on any host where the ansible login does not work yet.
retired_users:
  - harry

# First login on fresh hosts, see bootstrap.yml. Its password comes from the
# Semaphore secret variable harry_password.
bootstrap_user: harry

# harry's password from the Semaphore environment variable secret harry_password.
# An extra variable secret with the same name overrides this.
harry_password: "{{ lookup('ansible.builtin.env', 'harry_password') }}"

# Rustic backups to Backblaze B2 (backups.yml). All come from Semaphore environment variable secrets.
rustic_password: "{{ lookup('ansible.builtin.env', 'rustic_password') }}"
rustic_b2_key_id: "{{ lookup('ansible.builtin.env', 'b2_key_id') }}"
rustic_b2_key: "{{ lookup('ansible.builtin.env', 'b2_key') }}"
rustic_b2_bucket: "{{ lookup('ansible.builtin.env', 'b2_bucket') }}"
rustic_b2_bucket_id: "{{ lookup('ansible.builtin.env', 'b2_bucket_id') }}"

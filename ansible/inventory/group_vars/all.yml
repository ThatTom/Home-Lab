# Accounts kept identical on every host by the base role (bootstrap.yml)
# Public keys for each user are read from roles/base/files/ssh-keys/<user>/*.pub
managed_users:
  - name: tomt
    groups:
      - sudo
      - docker
    nopasswd_sudo: true
  - name: ansible
    groups: []
    nopasswd_sudo: true

# Only key based SSH logins are accepted once bootstrapped
ssh_password_authentication: false

# Bootstrap logins that get disabled once the managed users above exist.
# bootstrap.yml only does this while logged in as the ansible user, so harry
# stays usable on any host where the ansible login does not work yet.
retired_users:
  - harry

# First login on fresh hosts, see bootstrap.yml. Its password comes from the
# Semaphore secret variable harry_password.
bootstrap_user: harry

# harry's password from the Semaphore environment variable secret harry_password.
# An extra variable secret with the same name overrides this.
harry_password: "{{ lookup('ansible.builtin.env', 'harry_password') }}"

# Rustic backups to Backblaze B2 (backups.yml). All come from Semaphore environment variable secrets.
rustic_password: "{{ lookup('ansible.builtin.env', 'rustic_password') }}"
rustic_b2_key_id: "{{ lookup('ansible.builtin.env', 'b2_key_id') }}"
rustic_b2_key: "{{ lookup('ansible.builtin.env', 'b2_key') }}"
rustic_b2_bucket: "{{ lookup('ansible.builtin.env', 'b2_bucket') }}"
rustic_b2_bucket_id: "{{ lookup('ansible.builtin.env', 'b2_bucket_id') }}"

# Overlay networks shared between stacks (swarm.yml). Existing networks keep their
# current settings, so adding a subnet here later would need the network recreating.
swarm_overlay_networks:
  - name: diagon-alley
  - name: media
  - name: komodo-link
    attachable: true
  - name: monitoring-internal

# NFS shares on gringotts, created as Docker volumes on every node (swarm.yml).
nas_address: 10.10.20.30
nfs_volumes:
  - name: media-movies
    path: /mnt/Hogwarts-Vault/Movies
  - name: media-shows
    path: /mnt/Hogwarts-Vault/Shows
  - name: media-books
    path: /mnt/Hogwarts-Vault/Books
  - name: media-music
    path: /mnt/Hogwarts-Vault/Music
  - name: termix-data
    path: /mnt/Hogwarts-Vault/DockerVolumes/Termix
  # Semaphore's database and its config.json (which holds the key its stored secrets are encrypted with).
  # create: true makes the folder on the share if it's missing, owned by Semaphore's user.
  - name: semaphore-data
    path: /mnt/Hogwarts-Vault/DockerVolumes/Semaphore/data
    create: true
    owner: "1001:0"
  - name: semaphore-config
    path: /mnt/Hogwarts-Vault/DockerVolumes/Semaphore/config
    create: true
    owner: "1001:0"

# Swarm secrets created by swarm.yml from Semaphore environment variable secrets
swarm_secrets:
  - name: ntfy-alertmanager-token        # ntfy access token Alertmanager posts alerts with
    value: "{{ lookup('ansible.builtin.env', 'ntfy_alert_token') }}"
  - name: healthchecks-ping-url          # healthchecks.io ping URL Alertmanager sends the Watchdog heartbeat to
    value: "{{ lookup('ansible.builtin.env', 'healthchecks_ping_url') }}"

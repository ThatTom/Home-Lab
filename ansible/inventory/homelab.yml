# Addresses match the Servers VLAN (20) in network/README.md
all:
  vars:
    ansible_user: ansible               # created by bootstrap.yml, key held by Semaphore
    ansible_python_interpreter: auto_silent
    ansible_ssh_common_args: "-o StrictHostKeyChecking=accept-new"   # Semaphore has no stored known_hosts
  children:
    swarm:
      children:
        swarm_managers:
          hosts:
            dumbledore:
              ansible_host: 10.10.20.10
              keepalived_priority: 150    # holds the Traefik VIP while healthy
            flitwick:
              ansible_host: 10.10.20.11
              keepalived_priority: 100
              swarm_node_labels:
                ai: "yes"                 # Open WebUI
        swarm_workers:
          vars:
            # Ubuntu's default sudo is sudo-rs, whose password prompt Ansible doesn't recognise.
            # sudo.ws is the classic sudo, still installed alongside it.
            ansible_become_exe: sudo.ws
          hosts:
            dobby:
              ansible_host: 10.10.20.20
              swarm_node_labels:
                media: "yes"              # Jellyfin and the media management stack
            winky:
              ansible_host: 10.10.20.21
              swarm_node_labels:
                media: "yes"

all:
  vars:
    ansible_user: tom                  # the account Semaphore's SSH key logs in as
    ansible_python_interpreter: auto_silent
  children:
    failover_pair:
      hosts:
        srv-01:
          ansible_host: 192.168.1.20   # or a hostname that resolves from Semaphore
        srv-02:
          ansible_host: 192.168.1.21
    swarm_managers:
      hosts:
        rpi-1:
          ansible_host: 192.168.1.18
        rpi-2:
          ansible_host: 192.168.1.19
# Swarm nodes on the Servers VLAN (20) and network devices on the Management VLAN (10), addresses match network/README.md
all:
  vars:
    ansible_user: ansible               # created by bootstrap.yml, key held by Semaphore
    ansible_python_interpreter: auto_silent
    ansible_ssh_common_args: "-o StrictHostKeyChecking=accept-new"   # Semaphore has no stored known_hosts
  children:
    swarm:
      children:
        swarm_managers:
          hosts:
            dumbledore:
              ansible_host: 10.10.20.10
              keepalived_priority: 150    # holds the Traefik VIP while healthy
              swarm_node_labels:
                traefik: "yes"            # runs Traefik, has keepalived and the dynamic config
            flitwick:
              ansible_host: 10.10.20.11
              keepalived_priority: 100
              swarm_node_labels:
                ai: "yes"                 # Open WebUI
                traefik: "yes"
        swarm_workers:
          vars:
            # Ubuntu's default sudo is sudo-rs, whose password prompt Ansible doesn't recognise.
            # sudo.ws is the classic sudo, still installed alongside it.
            ansible_become_exe: sudo.ws
          hosts:
            dobby:
              ansible_host: 10.10.20.20
              swarm_node_labels:
                media: "yes"              # Jellyfin and the media management stack
            winky:
              ansible_host: 10.10.20.21
              swarm_node_labels:
                media: "yes"
    # Router and switches on the Management VLAN (10). There's nothing to log in to: every task is an
    # HTTPS / HTTP call made from the Ansible controller, see roles/routeros and roles/tplink_easy_smart.
    network:
      vars:
        ansible_connection: local
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
      children:
        routeros:
          hosts:
            leaky-cauldron:
              routeros_host: 10.10.10.1
        tplink_switches:
          hosts:
            floo:
              tplink_host: 10.10.10.2
            portkey:
              tplink_host: 10.10.10.3

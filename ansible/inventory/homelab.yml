all:
  vars:
    ansible_user: ansible               # created by bootstrap.yml, key held by Semaphore
    ansible_python_interpreter: auto_silent
    ansible_ssh_common_args: "-o StrictHostKeyChecking=accept-new"   # Semaphore has no stored known_hosts
  children:
    failover_pair:
      hosts:
        dobby:
          ansible_host: 192.168.100.20   # or a hostname that resolves from Semaphore
        winky:
          ansible_host: 192.168.100.21
    swarm_managers:
      hosts:
        dumbledore:
          ansible_host: 192.168.100.18
        flitwick:
          ansible_host: 192.168.100.19
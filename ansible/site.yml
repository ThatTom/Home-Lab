# Brings every host to its full configured state in one run.
# bootstrap.yml picks the login per host, so no extra variables are needed.
# patch.yml isn't included, it's run on its own schedule.
- name: Base setup
  ansible.builtin.import_playbook: bootstrap.yml

- name: Docker Engine
  ansible.builtin.import_playbook: docker.yml

- name: Unattended security updates
  ansible.builtin.import_playbook: updates.yml

- name: Swarm networks, node labels and NFS volumes
  ansible.builtin.import_playbook: swarm.yml

- name: Traefik dynamic config
  ansible.builtin.import_playbook: traefik-config.yml

- name: Traefik floating IP
  ansible.builtin.import_playbook: keepalived.yml

- name: Backups
  ansible.builtin.import_playbook: backups.yml

- name: Restore test
  ansible.builtin.import_playbook: restore-test.yml

# Brings every host to its full configured state in one run.
# bootstrap.yml picks the login per host, so no extra variables are needed.
- name: Base setup
  ansible.builtin.import_playbook: bootstrap.yml

- name: Traefik dynamic config
  ansible.builtin.import_playbook: traefik-config.yml

- name: Traefik floating IP
  ansible.builtin.import_playbook: keepalived.yml

- name: Backups
  ansible.builtin.import_playbook: backups.yml

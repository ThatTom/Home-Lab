- name: Replicate appdata within failover pair
  hosts: failover_pair
  become: true
  gather_facts: false
  vars:
    peer: "{{ groups['failover_pair'] | difference([inventory_hostname]) | first }}"
    peer_addr: "{{ hostvars[peer].ansible_host | default(peer) }}"
  tasks:
    - name: Replicate each service
      ansible.builtin.include_tasks: tasks/replicate-one.yml
      loop: "{{ replicated_services }}"
      loop_control:
        loop_var: svc
        label: "{{ svc.name }}"